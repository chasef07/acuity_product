steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file
      - Dockerfile.backend
      - --build-arg
      - RELEASE_ENVIRONMENT=${_RELEASE_ENVIRONMENT}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_IMAGE}:${_IMAGE_TAG}
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file
      - web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_PORTAL_API_URL=${_PORTAL_API_URL}
      - --build-arg
      - NEXT_PUBLIC_REALTIME_URL=${_REALTIME_URL}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:${_IMAGE_TAG}
      - web

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_IMAGE}:${_IMAGE_TAG}

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:${_IMAGE_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:578.0.0-slim@sha256:70f3244ccf80a83c23805b5ff9f0b1a88d57b3fd07831d57a311e70625b289e9
    waitFor: [push-backend, push-web]
    entrypoint: /bin/bash
    args: [deploy/deploy-production-release.sh]
    env:
      - PROJECT_ID=$PROJECT_ID
      - REGION=${_REGION}
      - REPOSITORY=${_REPOSITORY}
      - BACKEND_IMAGE=${_BACKEND_IMAGE}
      - WEB_IMAGE=${_WEB_IMAGE}
      - IMAGE_TAG=${_IMAGE_TAG}
      - DEPLOYMENT_ID=$BUILD_ID
      - USABLE_DATABASE_CONNECTIONS=${_USABLE_DATABASE_CONNECTIONS}
      - MIDDLEWARE_BASE_URL=${_MIDDLEWARE_BASE_URL}
      - MIDDLEWARE_API_SECRET_SECRET=${_MIDDLEWARE_API_SECRET_SECRET}
      - PORTAL_API_URL=${_PORTAL_API_URL}
      - REALTIME_URL=${_REALTIME_URL}

substitutions:
  _IMAGE_TAG: DO_NOT_DEPLOY
  _RELEASE_ENVIRONMENT: DO_NOT_DEPLOY
  _REGION: us-east1
  _REPOSITORY: acuity-product
  _BACKEND_IMAGE: backend
  _WEB_IMAGE: web
  _PORTAL_API_URL: DO_NOT_DEPLOY
  _REALTIME_URL: DO_NOT_DEPLOY
  _USABLE_DATABASE_CONNECTIONS: DO_NOT_DEPLOY
  _MIDDLEWARE_BASE_URL: ""
  _MIDDLEWARE_API_SECRET_SECRET: ""

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
