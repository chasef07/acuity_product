steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file
      - Dockerfile.backend
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_IMAGE}:${_IMAGE_TAG}
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --file
      - web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_PORTAL_API_URL=${_PORTAL_API_URL}
      - --build-arg
      - NEXT_PUBLIC_REALTIME_URL=${_REALTIME_URL}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:${_IMAGE_TAG}
      - web

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_BACKEND_IMAGE}:${_IMAGE_TAG}

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:${_IMAGE_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:578.0.0-slim
    waitFor: [push-backend, push-web]
    entrypoint: /bin/bash
    args: [deploy/deploy-production-release.sh]
    env:
      - PROJECT_ID=$PROJECT_ID
      - REGION=${_REGION}
      - REPOSITORY=${_REPOSITORY}
      - BACKEND_IMAGE=${_BACKEND_IMAGE}
      - WEB_IMAGE=${_WEB_IMAGE}
      - IMAGE_TAG=${_IMAGE_TAG}
      - DEPLOYMENT_ID=$BUILD_ID
      - CALLLEG_SCHEMA_CUTOVER_COMPLETE=${_CALLLEG_SCHEMA_CUTOVER_COMPLETE}

substitutions:
  _IMAGE_TAG: DO_NOT_DEPLOY
  _REGION: us-east1
  _REPOSITORY: acuity-product
  _BACKEND_IMAGE: backend
  _WEB_IMAGE: web
  _PORTAL_API_URL: https://acuity-portal-api-cbuqwpsdsq-ue.a.run.app
  _REALTIME_URL: https://acuity-realtime-cbuqwpsdsq-ue.a.run.app
  _CALLLEG_SCHEMA_CUTOVER_COMPLETE: "false"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
