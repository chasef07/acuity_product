name: Knowledge

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'backend/cmd/knowledge-import/**'
      - 'backend/internal/knowledge/**'
      - 'scripts/knowledge-*'
      - '.github/workflows/knowledge.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'backend/cmd/knowledge-import/**'
      - 'backend/internal/knowledge/**'
      - 'scripts/knowledge-*'
      - '.github/workflows/knowledge.yml'
  workflow_dispatch:
    inputs:
      office:
        description: Office source filename without .yaml (for example spring-hill)
        required: true
        type: string
      expected_revision:
        description: Reviewed active database revision UUID (none only for initial publication)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./backend/cmd/knowledge-import
      - run: bash scripts/knowledge-validate.sh

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: knowledge-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Install Cloud SQL Auth Proxy
        run: go install github.com/GoogleCloudPlatform/cloud-sql-proxy/v2@v2.25.4
      - name: Publish and verify active revision
        env:
          KNOWLEDGE_OFFICE: ${{ inputs.office }}
          KNOWLEDGE_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          KNOWLEDGE_GOOGLE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          KNOWLEDGE_GOOGLE_LOCATION: ${{ vars.GCP_REGION }}
          KNOWLEDGE_SQL_INSTANCE: ${{ vars.KNOWLEDGE_SQL_INSTANCE }}
          KNOWLEDGE_DATABASE_SECRET: ${{ vars.KNOWLEDGE_DATABASE_SECRET }}
          KNOWLEDGE_OPERATOR_EMAIL: ${{ vars.KNOWLEDGE_OPERATOR_EMAIL }}
          KNOWLEDGE_API_URL: ${{ vars.KNOWLEDGE_API_URL }}
          KNOWLEDGE_SERVICE_TOKEN_SECRET: ${{ vars.KNOWLEDGE_SERVICE_TOKEN_SECRET }}
        run: bash scripts/knowledge-publish.sh
      - name: Preserve publication and retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-publication
          path: |
            knowledge-publication.json
            knowledge-evaluation.json
          if-no-files-found: ignore
