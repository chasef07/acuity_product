name: Knowledge

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'backend/cmd/knowledge-import/**'
      - 'backend/internal/knowledge/**'
      - 'scripts/knowledge-*'
      - 'scripts/test-knowledge-publish.py'
      - '.github/workflows/knowledge.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'backend/cmd/knowledge-import/**'
      - 'backend/internal/knowledge/**'
      - 'scripts/knowledge-*'
      - 'scripts/test-knowledge-publish.py'
      - '.github/workflows/knowledge.yml'
  workflow_dispatch:
    inputs:
      office:
        description: Office to publish (all publishes every office)
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./backend/cmd/knowledge-import
      - run: python3 scripts/test-knowledge-publish.py
      - run: bash scripts/knowledge-validate.sh

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: knowledge-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Require the current main commit
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo 'This run was superseded by a newer main commit. Run Knowledge from main again.' >&2
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Install Cloud SQL Auth Proxy
        run: go install github.com/GoogleCloudPlatform/cloud-sql-proxy/v2@v2.25.4
      - name: Publish and verify office knowledge
        env:
          KNOWLEDGE_OFFICE: ${{ inputs.office || 'all' }}
          KNOWLEDGE_OUTPUT_DIRECTORY: ${{ runner.temp }}/knowledge-publication
          KNOWLEDGE_GOOGLE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          KNOWLEDGE_GOOGLE_LOCATION: ${{ vars.GCP_REGION }}
          KNOWLEDGE_SQL_INSTANCE: ${{ vars.KNOWLEDGE_SQL_INSTANCE }}
          KNOWLEDGE_DATABASE_SECRET: ${{ vars.KNOWLEDGE_DATABASE_SECRET }}
          KNOWLEDGE_OPERATOR_EMAIL: ${{ vars.KNOWLEDGE_OPERATOR_EMAIL }}
          KNOWLEDGE_API_URL: ${{ vars.KNOWLEDGE_API_URL }}
          KNOWLEDGE_SERVICE_TOKEN_SECRET: ${{ vars.KNOWLEDGE_SERVICE_TOKEN_SECRET }}
        run: bash scripts/knowledge-publish.sh
      - name: Preserve publication and retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-publication
          path: ${{ runner.temp }}/knowledge-publication/
          if-no-files-found: ignore
