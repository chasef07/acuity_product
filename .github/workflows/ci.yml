name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_test?sslmode=disable
      NEXT_PUBLIC_PORTAL_API_URL: http://127.0.0.1:18080
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: go test ./backend/... ./deploy -count=1
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check generated contracts
        run: |
          PGPASSWORD=postgres createdb \
            --host 127.0.0.1 \
            --username postgres \
            acuity_schema_check
          go generate ./backend/internal/api
          npm --prefix web run api:generate
          AUTH_SCHEMA_CHECK_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/acuity_schema_check?sslmode=disable \
            ./scripts/check-auth-schema.sh
          git diff --exit-code -- \
            backend/internal/api/openapi.gen.go \
            backend/internal/migrations/sql/0003_better_auth.sql \
            web/src/lib/api/generated

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: ./scripts/run-e2e.sh

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: production
      url: https://acuity-web-cbuqwpsdsq-uc.a.run.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Build and release the tested commit
        run: |
          gcloud builds submit \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --service-account="projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" \
            --config=cloudbuild.release.yaml \
            --substitutions="_IMAGE_TAG=${GITHUB_SHA}" \
            .
