name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_test?sslmode=disable
      NEXT_PUBLIC_PORTAL_API_URL: http://127.0.0.1:18080
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: go test ./backend/... ./deploy -count=1
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check generated contracts
        run: |
          PGPASSWORD=postgres createdb \
            --host 127.0.0.1 \
            --username postgres \
            acuity_schema_check
          go generate ./backend/internal/api
          npm --prefix web run api:generate
          AUTH_SCHEMA_CHECK_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/acuity_schema_check?sslmode=disable \
            ./scripts/check-auth-schema.sh
          git diff --exit-code -- \
            backend/internal/api/openapi.gen.go \
            backend/internal/migrations/sql/0003_better_auth.sql \
            web/src/lib/api/generated

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: ./scripts/run-e2e.sh
