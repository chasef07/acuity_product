name: Verification

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test package resets its own database on this server.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: "1.27.4"
          cache: false
      # Separate workloads cannot overwrite each other's partial Go caches.
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-backend-${{ hashFiles('go.mod', 'go.sum') }}
      - run: go test ./backend/... ./deploy -count=1

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PORTAL_API_URL: http://127.0.0.1:18080
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm audit --prod
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test:unit
        working-directory: web

  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: "1.27.4"
          cache: false
      # Separate workloads cannot overwrite each other's partial Go caches.
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-contracts-${{ hashFiles('go.mod', 'go.sum') }}
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Check generated contracts
        run: |
          PGPASSWORD=postgres createdb \
            --host 127.0.0.1 \
            --username postgres \
            acuity_schema_check
          go generate ./backend/internal/api
          pnpm --dir web api:generate
          AUTH_SCHEMA_CHECK_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/acuity_schema_check?sslmode=disable \
            ./scripts/check-auth-schema.sh
          git diff --exit-code -- \
            backend/internal/api/openapi.gen.go \
            backend/internal/migrations/sql/0003_better_auth.sql \
            web/src/lib/api/generated
      - run: bash ./scripts/test-release-container.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./backend/...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks 'SA*,U1000,S1*' ./backend/... ./deploy
      - run: go vet ./backend/... ./deploy
      - run: test -z "$(gofmt -l backend deploy)"

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: "1.27.4"
          cache: false
      # Separate workloads cannot overwrite each other's partial Go caches.
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-browser-${{ hashFiles('go.mod', 'go.sum') }}
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**', 'web/public/**', 'web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - name: Remove unused runner Chrome package sources
        # Playwright downloads its own Chromium; stale Chrome indexes can break apt update.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - run: pnpm playwright install --with-deps chromium
        timeout-minutes: 10
        working-directory: web
      - run: ./scripts/run-e2e.sh
