name: Verification

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend-shard:
    if: github.event_name == 'pull_request'
    name: backend shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: calling
            database: acuity_calling_test
          - shard: domain
            database: acuity_domain_test
          - shard: support
            database: acuity_support_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/${{ matrix.database }}?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true
      - run: bash ./scripts/run-backend-test-shard.sh ${{ matrix.shard }}
      - if: matrix.shard == 'support'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./backend/...

  backend-exact:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true
      - run: go test -p 1 ./backend/... ./deploy -count=1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./backend/...

  backend:
    if: always()
    needs: [backend-shard, backend-exact]
    runs-on: ubuntu-latest
    steps:
      - name: Require the event-appropriate backend suite
        env:
          SHARD_RESULT: ${{ needs.backend-shard.result }}
          EXACT_RESULT: ${{ needs.backend-exact.result }}
        run: |
          if [[ "$SHARD_RESULT" == "success" && "$EXACT_RESULT" == "skipped" ]]; then
            exit 0
          fi
          if [[ "$SHARD_RESULT" == "skipped" && "$EXACT_RESULT" == "success" ]]; then
            exit 0
          fi
          echo "backend verification did not converge: shards=$SHARD_RESULT exact=$EXACT_RESULT" >&2
          exit 1

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PORTAL_API_URL: http://127.0.0.1:18080
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm audit --prod
        working-directory: web
      - uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**', 'web/public/**', 'web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test:unit
        working-directory: web
      - run: pnpm build
        working-directory: web

  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Check generated contracts
        run: |
          PGPASSWORD=postgres createdb \
            --host 127.0.0.1 \
            --username postgres \
            acuity_schema_check
          go generate ./backend/internal/api
          pnpm --dir web api:generate
          AUTH_SCHEMA_CHECK_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/acuity_schema_check?sslmode=disable \
            ./scripts/check-auth-schema.sh
          git diff --exit-code -- \
            backend/internal/api/openapi.gen.go \
            backend/internal/migrations/sql/0003_better_auth.sql \
            web/src/lib/api/generated

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acuity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acuity_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acuity_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**', 'web/public/**', 'web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm playwright install --with-deps chromium
        timeout-minutes: 10
        working-directory: web
      - run: ./scripts/run-e2e.sh
