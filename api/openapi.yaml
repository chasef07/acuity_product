openapi: 3.0.3
info:
  title: Acuity Portal API
  version: 2026-07-29
  description: >
    Acuity Portal Access, HumanCalling, Work, and Messaging interfaces with
    PostgreSQL authority, durable commands and receipts, and disposable
    realtime hints.
servers:
  - url: https://api.acuity.example
    description: Deployment-supplied HTTPS origin
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Required runtime dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/access/sign-up-eligibility:
    post:
      operationId: inspectSignUpEligibility
      summary: Validate an invitation or provisioned Platform Operator email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpEligibilityRequest"
      responses:
        "200":
          description: The verified-email sign-up is eligible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/access:
    get:
      operationId: discoverAccess
      summary: Discover current Practice and Location authorization.
      responses:
        "200":
          description: Current Access authority from PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessDiscovery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invitations/inspect:
    post:
      operationId: inspectInvitation
      summary: Inspect only the scope attached to the presented invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCredentialRequest"
      responses:
        "200":
          description: Pending invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Atomically activate an invitation for the verified identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCredentialRequest"
      responses:
        "200":
          description: Membership and authorized scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: Load the authoritative empty workspace snapshot.
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized workspace snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/support-mode:
    post:
      operationId: enterSupportMode
      summary: Enter time-limited Support Mode for one Practice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterSupportModeRequest"
      responses:
        "201":
          description: Active Support Mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/support-mode/{supportSessionId}:
    delete:
      operationId: revokeSupportMode
      summary: Revoke the real operator's active Support Mode.
      parameters:
        - name: supportSessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Support Mode revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/practices/{practiceId}/locations:
    post:
      operationId: addLocation
      summary: Add a Location as a Platform Operator in Support Mode.
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLocationRequest"
      responses:
        "201":
          description: Committed Location mutation and audit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationMutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/events:
    get:
      operationId: getEvents
      summary: Stream disposable version hints for one authorized scope.
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Bounded text/event-stream. Initial connection and every reconnect
            require an authoritative workspace refetch.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/handoffs:
    post:
      operationId: createHandoff
      summary: Create one authenticated, idempotent Abita handoff.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHandoffRequest"
      responses:
        "201":
          description: Opaque single-use SIP handoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/provider/telnyx/webhooks:
    post:
      operationId: receiveTelnyxWebhook
      summary: Verify and durably receipt one raw Telnyx webhook.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Receipt durably committed or accepted duplicate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/softphone/lease:
    post:
      operationId: acquireSoftphone
      summary: Acquire, renew, or explicitly take over the User's softphone lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftphoneLeaseRequest"
      responses:
        "200":
          description: Current softphone ownership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftphoneState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/readiness:
    put:
      operationId: setCallingReadiness
      summary: Commit the media-owning session's current technical readiness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingReadinessRequest"
      responses:
        "200":
          description: Current derived operational state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftphoneState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/media-token:
    post:
      operationId: issueCallingMediaToken
      summary: Issue a short-lived Telnyx JWT to the current softphone owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaTokenRequest"
      responses:
        "200":
          description: Short-lived browser media credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/state:
    get:
      operationId: getCallingState
      summary: Read durable softphone and CallLeg convergence state.
      responses:
        "200":
          description: Current authorized calling state.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingState"
        "304":
          description: Calling state has not changed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/outbound-calls:
    post:
      operationId: startOutboundCall
      summary: Commit one Task-originated or standalone outbound Call before provider contact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOutboundCallRequest"
      responses:
        "201":
          description: Durable outbound Call attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/tasks/{taskId}/eligibility:
    get:
      operationId: getTaskOutboundEligibility
      summary: Explain whether the current Task route is eligible for outbound calling.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current server-derived Task call eligibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundCallEligibility"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}:
    get:
      operationId: getCallingCall
      summary: Read the winning User's durable active or disposition Call.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized Call workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/media-ready:
    post:
      operationId: confirmCallingMediaReady
      summary: Confirm that the owning browser attached the answered staff media session.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCallingMediaRequest"
      responses:
        "200":
          description: The outbound Call after destination dialing was safely committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/retry:
    post:
      operationId: retryOutboundCall
      summary: Commit an intentional outbound retry linked to a terminal or unknown attempt.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryOutboundCallRequest"
      responses:
        "201":
          description: New linked outbound Call attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/hangup:
    post:
      operationId: requestCallingHangup
      summary: Commit a provider hangup command without claiming termination.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingControlRequest"
      responses:
        "202":
          description: Hangup intent committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/disposition:
    post:
      operationId: recordCallingDisposition
      summary: Resolve the provider-terminated Call and optionally ensure its one follow-up Task.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingDispositionRequest"
      responses:
        "200":
          description: Durable terminal Call outcome and optional linked Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingDispositionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/history:
    get:
      operationId: getCallingCallHistory
      summary: Read authorized exact-phone Call Engagement History for the active Call.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Newest page presented in chronological order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/engagement-history:
    get:
      operationId: getCallingEngagementHistory
      summary: Compose exact-phone Messages, Calls, and Tasks across currently authorized Practice Locations.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Chronological Contact Context Engagement History.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTimelinePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/voicemail-playback:
    post:
      operationId: issueCallingVoicemailPlayback
      summary: Issue a short-lived playback capability after current Location authorization.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Short-lived authorized playback capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicemailPlaybackCapability"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/voicemail-playback/{token}:
    get:
      operationId: getCallingVoicemailPlayback
      summary: Refresh and stream Telnyx-owned voicemail audio without exposing the provider URL.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: Range
          in: header
          required: false
          description: Optional single byte range forwarded to the provider audio request.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Authorized complete voicemail audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Authorized partial voicemail audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "404":
          description: The Telnyx recording is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          description: Telnyx recording retrieval timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/engagements/query:
    post:
      operationId: queryEngagements
      summary: Resolve one authorized exact-phone Engagement across Practice Locations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementQueryRequest"
      responses:
        "200":
          description: Exact-phone results within the current User's Location Scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/engagements/{phone}/timeline:
    get:
      operationId: getEngagementTimeline
      summary: Read one authorized exact-phone Engagement History.
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 32
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Chronological exact-phone Engagement History.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTimelinePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/ai/interactions:
    post:
      operationId: ingestAIInteraction
      summary: Persist one authenticated Abita AI call lifecycle message.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIInteractionIngestRequest"
      responses:
        "200":
          description: Existing Interaction advanced without losing richer evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInteractionReceipt"
        "201":
          description: New Interaction persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInteractionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/ai/interactions/{interactionId}:
    get:
      operationId: getAIInteraction
      summary: Read one authorized AI Interaction transcript and outcome detail.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized AI Interaction detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInteractionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/ai/interactions/outcomes/query:
    post:
      operationId: queryAIInteractionOutcomes
      summary: Read authorized AI appointment outcomes for one UTC interaction date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIOutcomeQueryRequest"
      responses:
        "200":
          description: Authorized date-scoped AI outcome projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIOutcomePage"
        "400":
