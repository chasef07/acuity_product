openapi: 3.0.3
info:
  title: Acuity Portal API
  version: 2026-07-29
  description: >
    Acuity Portal Access, HumanCalling, Work, and Messaging interfaces with
    PostgreSQL authority, durable commands and receipts, and disposable
    realtime hints.
servers:
  - url: https://api.acuity.example
    description: Deployment-supplied HTTPS origin
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Required runtime dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/access/sign-up-eligibility:
    post:
      operationId: inspectSignUpEligibility
      summary: Answer only whether a verified email may create a sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpEligibilityRequest"
      responses:
        "204":
          description: The verified-email sign-up is eligible.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/access:
    get:
      operationId: discoverAccess
      summary: Discover current Practice and Location authorization.
      responses:
        "200":
          description: Current Access authority from PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessDiscovery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: Load the authoritative empty workspace snapshot.
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized workspace snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/practices/{practiceId}/locations:
    post:
      operationId: addLocation
      summary: Add a Location as a Platform Operator.
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLocationRequest"
      responses:
        "201":
          description: Committed Location mutation and audit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationMutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/events:
    get:
      operationId: getEvents
      summary: Stream disposable version hints for one authorized scope.
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Bounded text/event-stream. Initial connection and every reconnect
            require an authoritative workspace refetch. `ready` and `hint`
            events carry `practiceId` and the workspace `version`; `ready`
            sets `callingHints: true` when the stream also sends `calling`
            events and `heartbeatMilliseconds` to the server heartbeat
            interval, which bounds how long a healthy stream stays silent.
            A `calling` event carries only `practiceId` and means
            Calling state for that Practice may have changed; clients refetch
            Calling state and must ignore event types they do not recognize.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/handoffs:
    post:
      operationId: createHandoff
      summary: Create one authenticated, idempotent Abita handoff.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHandoffRequest"
      responses:
        "201":
          description: Opaque single-use SIP handoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/provider/telnyx/webhooks:
    post:
      operationId: receiveTelnyxWebhook
      summary: Verify and durably receipt one raw Telnyx webhook.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Receipt durably committed or accepted duplicate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/softphone/lease:
    post:
      operationId: acquireSoftphone
      summary: Acquire, renew, or explicitly take over the User's softphone lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftphoneLeaseRequest"
      responses:
        "200":
          description: Current softphone ownership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftphoneState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/readiness:
    put:
      operationId: setCallingReadiness
      summary: Commit the media-owning session's current technical readiness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingReadinessRequest"
      responses:
        "200":
          description: Current derived operational state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftphoneState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/media-token:
    post:
      operationId: issueCallingMediaToken
      summary: Issue a short-lived Telnyx JWT to the current softphone owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaTokenRequest"
      responses:
        "200":
          description: Short-lived browser media credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/state:
    get:
      operationId: getCallingState
      summary: Read durable softphone and CallLeg convergence state.
      responses:
        "200":
          description: Current authorized calling state.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingState"
        "304":
          description: Calling state has not changed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/outbound-calls:
    post:
      operationId: startOutboundCall
      summary: Commit one Task-originated or standalone outbound Call before provider contact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOutboundCallRequest"
      responses:
        "201":
          description: Durable outbound Call attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/tasks/{taskId}/eligibility:
    get:
      operationId: getTaskOutboundEligibility
      summary: Explain whether the current Task route is eligible for outbound calling.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current server-derived Task call eligibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundCallEligibility"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}:
    get:
      operationId: getCallingCall
      summary: Read the winning User's durable active or disposition Call.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized Call workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/transfer-candidates:
    get:
      operationId: listStaffTransferCandidates
      summary: List eligible available Staff at the connected Call's Location.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Current same-Location transfer candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTransferCandidateList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/transfers:
    post:
      operationId: requestStaffTransfer
      summary: Commit one acceptance-based same-Location Staff transfer.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTransferRequest"
      responses:
        "202":
          description: Durable transfer request and stable provider command committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/transfers/{transferId}/decline:
    post:
      operationId: declineStaffTransfer
      summary: Decline the exact incoming Staff transfer offer.
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTransferResponseRequest"
      responses:
        "200":
          description: Terminal declined transfer; source ownership is preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/transfers/{transferId}/cancel:
    post:
      operationId: cancelStaffTransfer
      summary: Cancel the source User's pending Staff transfer.
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTransferResponseRequest"
      responses:
        "200":
          description: Terminal canceled transfer; source ownership is preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/media-ready:
    post:
      operationId: confirmCallingMediaReady
      summary: Confirm that the owning browser attached the answered staff media session.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCallingMediaRequest"
      responses:
        "200":
          description: The outbound Call after destination dialing was safely committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/retry:
    post:
      operationId: retryOutboundCall
      summary: Commit an intentional outbound retry linked to a terminal or unknown attempt.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryOutboundCallRequest"
      responses:
        "201":
          description: New linked outbound Call attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/hangup:
    post:
      operationId: requestCallingHangup
      summary: Commit owned Call end intent without claiming provider termination.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingControlRequest"
      responses:
        "202":
          description: Call end intent committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/disposition:
    post:
      operationId: recordCallingDisposition
      summary: Resolve the provider-terminated Call and optionally ensure its one follow-up Task.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingDispositionRequest"
      responses:
        "200":
          description: Durable terminal Call outcome and optional linked Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingDispositionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/voicemail-playback:
    post:
      operationId: issueCallingVoicemailPlayback
      summary: Issue a short-lived playback capability after current Location authorization.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Short-lived authorized playback capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicemailPlaybackCapability"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/voicemail-playback/{token}:
    get:
      operationId: getCallingVoicemailPlayback
      summary: Stream Telnyx-owned voicemail audio through a short-lived bearer capability without exposing the provider URL.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: Range
          in: header
          required: false
          description: Optional single byte range forwarded to the provider audio request.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Authorized complete voicemail audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Authorized partial voicemail audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Denied"
        "404":
          description: The Telnyx recording is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          description: Telnyx recording retrieval timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/calling/calls/{callId}/recording-playback:
    post:
      operationId: issueCallingRecordingPlayback
      summary: Issue a short-lived connected-call recording playback capability after current Location authorization.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Short-lived authorized playback capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPlaybackCapability"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/recording-playback/{token}:
    get:
      operationId: getCallingRecordingPlayback
      summary: Stream Telnyx-owned connected-call audio through a short-lived bearer capability without exposing the provider URL.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: Range
          in: header
          required: false
          description: Optional single byte range forwarded to the provider audio request.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Authorized complete connected-call audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Authorized partial connected-call audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Denied"
        "404":
          description: The Telnyx recording is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          description: Telnyx recording retrieval timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/engagements/{phone}/timeline:
    get:
      operationId: getEngagementTimeline
      summary: Read one authorized exact-phone Engagement History.
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 32
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: groupCalls
          in: query
          description: Return each call with its linked AI and Task evidence as one shared call history item. Defaults to the flat history for existing clients.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Chronological exact-phone Engagement History.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTimelinePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/ai/interactions:
    post:
      operationId: ingestAIInteraction
      summary: Persist one authenticated Abita AI call lifecycle message.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIInteractionIngestRequest"
      responses:
        "200":
          description: Existing Interaction advanced without losing richer evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInteractionReceipt"
        "201":
          description: New Interaction persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInteractionReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/ai/interactions/{interactionId}:
