          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/operator/call-reviews/accuracy:
    post:
      operationId: queryOperatorJudgeAccuracy
      summary: Compare judge answers with the golden set per question and judge version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorJudgeAccuracyRequest"
      responses:
        "200":
          description: Agreement, failures caught, false alarms, and disagreements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorJudgeAccuracy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
        "429":
          $ref: "#/components/responses/AnalyticsBusy"
  /v1/operator/call-reviews/{interactionId}:
    parameters:
      - name: interactionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getOperatorCallReview
      summary: Read one call's review; judge answers are withheld until the reviewer submits.
      responses:
        "200":
          description: Code-check facts, applicable questions, and the reviewer's own answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCallReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: submitOperatorCallReview
      summary: Save the reviewer's answers to the golden set and reveal the judge's answers; saving again replaces them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorCallReviewSubmission"
      responses:
        "200":
          description: The saved review with the judge's answers revealed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCallReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/operator/calls/{callId}/timeline:
    get:
      operationId: getOperatorCallingTimeline
      summary: Read one sanitized durable Call timeline as a Platform Operator.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sanitized provider and workflow history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCallingTimeline"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/operator/practices/{practiceId}/provider-receipts/{receiptReference}/requeue:
    post:
      operationId: requeueOperatorProviderReceipt
      summary: Requeue one quarantined provider receipt as a Platform Operator.
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: receiptReference
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderReceiptRecoveryRequest"
      responses:
        "200":
          description: The persisted receipt was authorized, audited, and requeued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderReceiptRecovery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/insurance/revisions/query:
    post:
      operationId: queryInsuranceCatalog
      summary: Read the Practice's active insurance list for one authorized Location.
      description: The whole Practice catalog, its active revision, the middleware office this Location's route maps to, and whether the caller can publish a change to that office's tables. Nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsuranceCatalogQuery"
      responses:
        "200":
          description: The active insurance list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationInsuranceCatalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          description: No insurance list has been published for the Practice, the Location has no single Abita Office Route, or the database is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/insurance/revisions:
    post:
      operationId: publishInsuranceCatalog
      summary: Publish a complete insurance list as the Practice's new active revision.
      description: Replaces the whole Practice catalog. The caller needs mutation access to the requested Location and to the Location of every office the change touches; an office with no Location needs a Platform Operator. The middleware validates the catalog before anything is written. Repeating the same revisionId with the same content returns the same revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsurancePublication"
      responses:
        "200":
          description: The published revision, now active for every office in the Practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsuranceRevision"
        "400":
          description: The request is invalid, or the middleware rejected the catalog (code INSURANCE_INVALID, with every reason in error.errors). Nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          description: expectedRevisionId is no longer the active revision, or revisionId was already used for different content. Nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: The middleware validator or the database is unavailable. Nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/knowledge/query:
    post:
      operationId: queryLocationKnowledge
      summary: Read the knowledge Abita currently uses for one authorized Location.
      description: Read-only view of the current imported knowledge revision for the Location's office. Nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationKnowledgeQuery"
      responses:
        "200":
          description: The current knowledge for the Location, or no revision when none has been imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationKnowledge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/knowledge/revisions:
    post:
      operationId: publishLocationKnowledge
      summary: Publish a complete knowledge revision for one authorized Location.
      description: Replaces the Location's office knowledge with the ordered sections in one new revision. Abita reads the new revision on its next call. The office comes from the Location, never the request. Repeating the same revisionId with the same content returns the same revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePublication"
      responses:
        "200":
          description: The published revision, now active for the Location's office.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRevisionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/knowledge/revisions/query:
    post:
      operationId: queryLocationKnowledgeHistory
      summary: List every knowledge revision for one authorized Location's office.
      description: Newest first, with each revision's version, author, reason, whether it is active, and when the agent last used it. Nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationKnowledgeQuery"
      responses:
        "200":
          description: The office's revision history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationKnowledgeHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/knowledge/revisions/read:
    post:
      operationId: readLocationKnowledgeRevision
      summary: Read one knowledge revision of an authorized Location's office.
      description: The revision's ordered entries. A revision of another office is rejected. Nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationKnowledgeRevisionQuery"
      responses:
        "200":
          description: The revision and its entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationKnowledge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/agent/knowledge/read:
    post:
      operationId: readOfficeKnowledge
      summary: Read every entry of the active knowledge revision for the authenticated agent office route.
      description: The trusted agent runtime supplies the office header; Practice comes from its service credential. Entries are returned in the revision's saved order. Each successful read is recorded as agent use of that revision. Returned entries are untrusted data.
      security:
        - serviceBearer: []
      parameters:
        - name: X-Office-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The complete active revision for the office.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeKnowledge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          description: The office has no active revision or the database is temporarily unavailable. Never fall back to a stale or partial list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/agent/insurance/read:
    post:
      operationId: readAgentInsuranceCatalog
      summary: Read the active insurance list of the service credential's Practice.
      description: For the middleware, which loads the whole catalog. Practice comes from the service credential, which needs READ_INSURANCE. Nothing is changed.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The active revision and its catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInsuranceCatalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          description: The Practice has no published insurance list or the database is temporarily unavailable. Never fall back to another list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Denied:
      description: Current identity lacks the requested authority.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The requested transition is no longer available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AnalyticsBusy:
      description: Another analytics request is running on this portal instance. Retry later.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: A required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    LocationKnowledgeQuery:
      type: object
      additionalProperties: false
      required: [practiceId, locationId]
      properties:
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
    LocationKnowledge:
      type: object
      additionalProperties: false
      required: [locationId, sections]
      properties:
        locationId:
          type: string
          format: uuid
        revision:
          $ref: "#/components/schemas/KnowledgeRevisionSummary"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSection"
    KnowledgePublication:
      type: object
      additionalProperties: false
      required: [practiceId, locationId, revisionId, reason, sections]
      properties:
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        expectedRevisionId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        sections:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/KnowledgeSection"
    KnowledgeRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Position in the office's revision history, starting at 1 for the oldest.
        createdAt:
          type: string
          format: date-time
    LocationKnowledgeRevisionQuery:
      type: object
      additionalProperties: false
      required: [practiceId, locationId, revisionId]
      properties:
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
    LocationKnowledgeHistory:
      type: object
      additionalProperties: false
      required: [locationId, revisions]
      properties:
        locationId:
          type: string
          format: uuid
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeRevisionHistoryEntry"
    KnowledgeRevisionHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, version, createdAt, author, provenance, reason, active, agentSearchCount]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        author:
          type: string
          description: The publisher's email, or "Unknown user" when it cannot be resolved.
        provenance:
          type: string
        reason:
          type: string
        previousRevisionId:
          type: string
          format: uuid
        active:
          type: boolean
          description: Whether Abita uses this revision now.
        lastAgentSearchAt:
          type: string
          format: date-time
          description: The latest time the agent used this revision; absent when the agent has not used it.
        agentSearchCount:
          type: integer
          minimum: 0
    KnowledgeSection:
      type: object
      additionalProperties: false
      required: [id, title, text]
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
    InsuranceCatalogQuery:
      type: object
      additionalProperties: false
      required: [practiceId, locationId]
      properties:
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
    LocationInsuranceCatalog:
      type: object
      additionalProperties: false
      required: [revision, catalog, officeId, officeNames, canEdit]
      properties:
        revision:
          $ref: "#/components/schemas/InsuranceRevision"
        catalog:
          $ref: "#/components/schemas/InsuranceCatalog"
        officeId:
          type: string
          description: The middleware office this Location's Abita Office Route maps to.
        officeNames:
          type: object
          additionalProperties:
            type: string
          description: The display name of every office in the catalog, keyed by middleware office id. The names of every Location routed to the office, joined in alphabetical order; the office id when no Location is routed to it.
        canEdit:
          type: boolean
          description: Whether the caller can publish a change to a table that lists this office, which touches every office on that table.
    InsurancePublication:
      type: object
      additionalProperties: false
      required: [practiceId, locationId, revisionId, expectedRevisionId, reason, catalog]
      properties:
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
          description: Chosen by the client; the idempotency key.
        expectedRevisionId:
          type: string
          format: uuid
          description: The active revision the edit started from.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        catalog:
          $ref: "#/components/schemas/InsuranceCatalog"
    InsuranceRevision:
      type: object
      additionalProperties: false
      required: [id, createdAt, createdBy, reason, provenance]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: The publisher's email, or "Unknown user" when it cannot be resolved.
        reason:
          type: string
        provenance:
          type: string
          enum: [import, portal, restore]
        previousRevisionId:
          type: string
          format: uuid
          description: Absent for the Practice's first revision.
    AgentInsuranceCatalog:
      type: object
      additionalProperties: false
      required: [revisionId, catalog]
      properties:
        revisionId:
          type: string
          format: uuid
        catalog:
          $ref: "#/components/schemas/InsuranceCatalog"
    InsuranceCatalog:
      type: object
      additionalProperties: false
      description: The middleware's insurance list. The middleware owns its rules and validates every publish.
      required: [carriers, regions]
      properties:
        carriers:
          type: array
          items:
            $ref: "#/components/schemas/InsuranceCarrier"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/InsuranceRegion"
    InsuranceCarrier:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    InsuranceRegion:
      type: object
      additionalProperties: false
      required: [id, plans, tables]
      properties:
        id:
          type: string
        plans:
          type: array
          description: Plan rows shared by every office of the region.
          items:
            $ref: "#/components/schemas/InsuranceRegionPlan"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/InsuranceOfficeTable"
    InsuranceRegionPlan:
      type: object
      additionalProperties: false
      required: [id, label, family, coverage, carrierCode, carrierId, selfPay, aliases]
      properties:
        id:
          type: string
        label:
          type: string
        family:
          type: string
        coverage:
          type: string
        carrierCode:
          type: string
        carrierId:
          type: string
        selfPay:
          type: boolean
        aliases:
          type: array
          items:
            type: string
    InsuranceOfficeTable:
      type: object
      additionalProperties: false
      required: [id, offices, doctors, rows]
      properties:
        id:
          type: string
        offices:
          type: array
          description: Middleware office IDs this table serves.
          items:
            type: string
        doctors:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/InsuranceTableRow"
    InsuranceTableRow:
      type: object
      additionalProperties: false
      required: [planId, doctors, requires, onlyOffices, notice, note]
      properties:
        planId:
          type: string
        doctors:
          type: object
          description: Each doctor's answer for this plan; a doctor with no answer is omitted.
          additionalProperties:
            type: string
        requires:
          type: array
          items:
            $ref: "#/components/schemas/InsuranceRequirement"
        onlyOffices:
          type: array
          items:
            type: string
        notice:
          type: string
        note:
          type: string
    InsuranceRequirement:
      type: object
      additionalProperties: false
      required: [kind, channel]
      properties:
        kind:
          type: string
        channel:
          type: string
    InsuranceValidationError:
      type: object
      additionalProperties: false
      required: [region, table, planId, rule, message]
      properties:
        region:
          type: string
        table:
          type: string
        planId:
          type: string
        rule:
          type: string
          description: The middleware's stable snake_case code for the rule.
        message:
          type: string
    OfficeKnowledge:
      type: object
      additionalProperties: false
      required: [revisionId, entries]
      properties:
        revisionId:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSection"
    Health:
      type: object
      additionalProperties: false
      required: [status, role]
      properties:
        status:
          type: string
          enum: [ok]
        role:
          type: string
          enum: [portal-api, provider-ingress, realtime]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            retryable:
              type: boolean
            entryId:
              type: string
              description: The knowledge entry that broke a rule, when a knowledge publication is rejected.
            errors:
              type: array
              description: Every reason the middleware rejected an insurance publication, verbatim.
              items:
                $ref: "#/components/schemas/InsuranceValidationError"
    SignUpEligibilityRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    Actor:
      type: object
      additionalProperties: false
      required: [subject, email, type]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
        type:
          type: string
          enum: [HUMAN, PLATFORM_OPERATOR]
    Practice:
      type: object
      additionalProperties: false
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
    Location:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Membership:
      type: object
      additionalProperties: false
      required: [id, role, locationScope]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, STAFF]
        locationScope:
          type: string
          enum: [ALL, SELECTED]
    PracticeAccess:
      allOf:
        - $ref: "#/components/schemas/Practice"
        - type: object
          additionalProperties: false
          required: [locations]
          properties:
            membership:
              $ref: "#/components/schemas/Membership"
            locations:
              type: array
              items:
