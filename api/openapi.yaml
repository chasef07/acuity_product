        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Denied:
      description: Current identity lacks the requested authority.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The requested transition is no longer available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: A required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, role]
      properties:
        status:
          type: string
          enum: [ok]
        role:
          type: string
          enum: [portal-api, provider-ingress, realtime]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            retryable:
              type: boolean
    SignUpEligibilityRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        invitationToken:
          type: string
          minLength: 32
          maxLength: 256
    InvitationCredentialRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [kind, email, locations]
      properties:
        kind:
          type: string
          enum: [PRACTICE_INVITATION, PLATFORM_OPERATOR]
        email:
          type: string
          format: email
        practiceId:
          type: string
          format: uuid
        practiceName:
          type: string
        role:
          type: string
          enum: [ADMIN, STAFF]
        locationScope:
          type: string
          enum: [ALL, SELECTED]
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        expiresAt:
          type: string
          format: date-time
    Actor:
      type: object
      additionalProperties: false
      required: [subject, email, type]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
        type:
          type: string
          enum: [HUMAN, PLATFORM_OPERATOR]
    Practice:
      type: object
      additionalProperties: false
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
    Location:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Membership:
      type: object
      additionalProperties: false
      required: [id, role, locationScope]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, STAFF]
        locationScope:
          type: string
          enum: [ALL, SELECTED]
    SupportMode:
      type: object
      additionalProperties: false
      required: [id, practiceId, reason, startsAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        reason:
          type: string
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Authorization:
      type: object
      additionalProperties: false
      required: [actor, practice, locations, platformOperator]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        practice:
          $ref: "#/components/schemas/Practice"
        membership:
          $ref: "#/components/schemas/Membership"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        activeLocation:
          $ref: "#/components/schemas/Location"
        platformOperator:
          type: boolean
        supportMode:
          $ref: "#/components/schemas/SupportMode"
    PracticeAccess:
      allOf:
        - $ref: "#/components/schemas/Practice"
        - type: object
          additionalProperties: false
          required: [locations]
          properties:
            membership:
              $ref: "#/components/schemas/Membership"
            locations:
              type: array
              items:
                $ref: "#/components/schemas/Location"
    AccessDiscovery:
      type: object
      additionalProperties: false
      required: [actor, platformOperator, practices]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        platformOperator:
          type: boolean
        practices:
          type: array
          items:
            $ref: "#/components/schemas/PracticeAccess"
    WorkspaceSnapshot:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - version
        - state
        - actor
        - practice
        - location
        - navigation
        - platformOperator
      properties:
        schemaVersion:
          type: string
          enum: ["2026-07-24"]
        version:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum: [EMPTY]
        actor:
          $ref: "#/components/schemas/Actor"
        practice:
          $ref: "#/components/schemas/Practice"
        location:
          $ref: "#/components/schemas/Location"
        membership:
          $ref: "#/components/schemas/Membership"
        platformOperator:
          type: boolean
        supportMode:
          $ref: "#/components/schemas/SupportMode"
        navigation:
          type: array
          items:
            $ref: "#/components/schemas/NavigationItem"
    NavigationItem:
      type: object
