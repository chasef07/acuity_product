          schema:
            type: string
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Intended attachment bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Denied"
  /v1/operator/calls/{callId}/timeline:
    get:
      operationId: getOperatorCallingTimeline
      summary: Read one sanitized durable Call timeline as a Platform Operator.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sanitized provider and workflow history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCallingTimeline"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/operator/practices/{practiceId}/provider-receipts/{receiptReference}/requeue:
    post:
      operationId: requeueOperatorProviderReceipt
      summary: Requeue one quarantined provider receipt as a Platform Operator.
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: receiptReference
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderReceiptRecoveryRequest"
      responses:
        "200":
          description: The persisted receipt was authorized, audited, and requeued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderReceiptRecovery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Denied:
      description: Current identity lacks the requested authority.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The requested transition is no longer available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AnalyticsBusy:
      description: Another analytics request is running on this portal instance. Retry later.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: A required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, role]
      properties:
        status:
          type: string
          enum: [ok]
        role:
          type: string
          enum: [portal-api, provider-ingress, realtime]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            retryable:
              type: boolean
    SignUpEligibilityRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    SignUpEligibility:
      type: object
      additionalProperties: false
      required: [kind, email]
      properties:
        kind:
          type: string
          enum: [ACCESS_GRANT, PLATFORM_OPERATOR]
        email:
          type: string
          format: email
    Actor:
      type: object
      additionalProperties: false
      required: [subject, email, type]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
        type:
          type: string
          enum: [HUMAN, PLATFORM_OPERATOR]
    Practice:
      type: object
      additionalProperties: false
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
    Location:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Membership:
      type: object
      additionalProperties: false
      required: [id, role, locationScope]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, STAFF]
        locationScope:
          type: string
          enum: [ALL, SELECTED]
    PracticeAccess:
      allOf:
        - $ref: "#/components/schemas/Practice"
        - type: object
          additionalProperties: false
          required: [locations, callingEnabled]
          properties:
            membership:
              $ref: "#/components/schemas/Membership"
            locations:
              type: array
              items:
                $ref: "#/components/schemas/Location"
            callingEnabled:
              type: boolean
    AccessDiscovery:
      type: object
      additionalProperties: false
      required: [actor, platformOperator, practices]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        platformOperator:
          type: boolean
        practices:
          type: array
          items:
            $ref: "#/components/schemas/PracticeAccess"
    WorkspaceSnapshot:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - version
        - state
        - actor
        - practice
        - location
        - navigation
        - platformOperator
      properties:
        schemaVersion:
          type: string
          enum: ["2026-07-24"]
        version:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum: [EMPTY]
        actor:
          $ref: "#/components/schemas/Actor"
        practice:
          $ref: "#/components/schemas/Practice"
        location:
          $ref: "#/components/schemas/Location"
        membership:
          $ref: "#/components/schemas/Membership"
        platformOperator:
          type: boolean
        navigation:
          type: array
          items:
            $ref: "#/components/schemas/NavigationItem"
    NavigationItem:
      type: object
      additionalProperties: false
      required: [id, label, enabled]
      properties:
        id:
          type: string
          enum: [tasks, messages, call-center, recordings, settings]
        label:
          type: string
        enabled:
          type: boolean
    ProviderReceiptRecoveryRequest:
      type: object
      additionalProperties: false
    ProviderReceiptRecovery:
      type: object
      additionalProperties: false
      required: [receiptReference, state]
      properties:
        receiptReference:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        state:
          type: string
          enum: [PENDING]
    AddLocationRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorSubject, practiceId, action, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorSubject:
          type: string
        practiceId:
          type: string
          format: uuid
        action:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    LocationMutation:
      type: object
      additionalProperties: false
      required: [location, practiceVersion, audit]
      properties:
        location:
          $ref: "#/components/schemas/Location"
        practiceVersion:
          type: integer
          format: int64
        audit:
          $ref: "#/components/schemas/AuditEvent"
    ContactContextInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        phoneSource:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 200
        nameSource:
          type: string
          maxLength: 100
        transferReason:
          type: string
          maxLength: 500
        reasonSource:
          type: string
          maxLength: 100
    CreateHandoffRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [practiceId, officeKey, sourceCallId, idempotencyKey, contact]
          properties:
            practiceId:
              type: string
              format: uuid
            officeKey:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,99}$"
              description: Preferred Abita Office Route identity.
            sourceCallId:
              type: string
              minLength: 1
              maxLength: 200
            idempotencyKey:
              type: string
              minLength: 1
              maxLength: 200
            contact:
              $ref: "#/components/schemas/ContactContextInput"
        - type: object
          additionalProperties: false
          required: [practiceId, locationId, sourceCallId, idempotencyKey, contact]
          properties:
            practiceId:
              type: string
              format: uuid
            locationId:
              type: string
              format: uuid
              description: Migration-only compatibility input.
            sourceCallId:
              type: string
              minLength: 1
              maxLength: 200
            idempotencyKey:
              type: string
              minLength: 1
              maxLength: 200
            contact:
              $ref: "#/components/schemas/ContactContextInput"
    Handoff:
      type: object
      additionalProperties: false
      required: [id, sipDestination, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        sipDestination:
          type: string
        expiresAt:
          type: string
          format: date-time
    SoftphoneLeaseRequest:
      type: object
      additionalProperties: false
      required: [sessionId, takeover]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        takeover:
          type: boolean
    CallingReadinessRequest:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - registered
        - microphoneReady
        - audioReady
        - sessionHealthy
        - available
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        registered:
          type: boolean
        microphoneReady:
          type: boolean
        audioReady:
          type: boolean
        sessionHealthy:
          type: boolean
        available:
          type: boolean
    SoftphoneState:
      type: object
      additionalProperties: false
      required: [sessionId, leaseExpiresAt, owner, available, activeCallId, pendingOutcomeCallId]
      properties:
        sessionId:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
        owner:
          type: boolean
        available:
          type: boolean
        activeCallId:
          type: string
          description: The User's current durable Call, or empty when capacity is free.
        pendingOutcomeCallId:
          type: string
          description: The latest connected Call awaiting an outcome, or empty when none remains.
    MediaTokenRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
    MediaToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    CallingState:
      type: object
      additionalProperties: false
      required: [softphone, ringing, staffTransfers]
      properties:
        softphone:
          $ref: "#/components/schemas/SoftphoneState"
        ringing:
          type: array
          items:
            $ref: "#/components/schemas/RingingCallLeg"
        staffTransfers:
          type: array
          items:
            $ref: "#/components/schemas/StaffTransfer"
        bridged:
          $ref: "#/components/schemas/CallingStateCall"
        voicemail:
          $ref: "#/components/schemas/CallingStateCall"
        disposition:
          $ref: "#/components/schemas/CallingStateCall"
    RingingCallLeg:
      type: object
      additionalProperties: false
      required: [callId, callLegId, mediaToken, practiceId, locationId, locationName, displayName, phone, transferReason, state, version, createdAt, deadline, offerKind, staffTransferId, originatorEmail, handoffNote]
      properties:
        callId:
          type: string
          format: uuid
        callLegId:
          type: string
          format: uuid
        mediaToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        displayName:
          type: string
        phone:
          type: string
          minLength: 1
        transferReason:
          type: string
        state:
          type: string
          enum: [PENDING, DIALING, RINGING, ANSWERED, BRIDGE_PENDING]
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        offerKind:
          type: string
          enum: [INBOUND_OFFER, STAFF_TRANSFER]
        staffTransferId:
          type: string
          description: Empty for an ordinary inbound offer.
        originatorEmail:
          type: string
        handoffNote:
          type: string
    CallingStateCall:
      type: object
      additionalProperties: false
      required: [callId, callLegId, practiceId, locationId, locationName, state, version]
      properties:
        callId:
          type: string
          format: uuid
        callLegId:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        state:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
    CallingControlRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
    StaffTransferCandidate:
      type: object
      additionalProperties: false
      required: [subject, email]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
    StaffTransferCandidateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StaffTransferCandidate"
    StaffTransferRequest:
      type: object
      additionalProperties: false
      required: [sessionId, recipientSubject, idempotencyKey, expectedVersion]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        recipientSubject:
          type: string
          minLength: 1
          maxLength: 200
        idempotencyKey:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        handoffNote:
          type: string
          maxLength: 500
    StaffTransferResponseRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
    StaffTransfer:
      type: object
      additionalProperties: false
      required:
        - id
        - callId
        - practiceId
        - locationId
        - locationName
        - sourceCallLegId
        - targetCallLegId
        - customerCallLegId
        - requestedBySubject
        - requestedByEmail
        - recipientSubject
        - recipientEmail
        - handoffNote
        - state
        - failureCode
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        callId:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        sourceCallLegId:
          type: string
          format: uuid
        targetCallLegId:
          type: string
          format: uuid
        customerCallLegId:
          type: string
          format: uuid
        requestedBySubject:
          type: string
        requestedByEmail:
          type: string
        recipientSubject:
          type: string
        recipientEmail:
          type: string
        handoffNote:
          type: string
        state:
          type: string
          enum: [REQUESTED, ACCEPTED, COMPLETED, DECLINED, EXPIRED, CANCELED, FAILED]
        failureCode:
          type: string
        targetAnsweredAt:
          type: string
          format: date-time
        bridgeObservedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    StartOutboundCallRequest:
      type: object
      additionalProperties: false
      required: [sessionId, idempotencyKey]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        idempotencyKey:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
        taskId:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        destination:
          type: string
          pattern: '^\+1[2-9][0-9]{2}[2-9][0-9]{6}$'
    RetryOutboundCallRequest:
      type: object
      additionalProperties: false
      required: [sessionId, idempotencyKey]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        idempotencyKey:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
    ConfirmCallingMediaRequest:
      type: object
      additionalProperties: false
      required: [sessionId, mediaToken]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        mediaToken:
          type: string
          minLength: 1
          maxLength: 200
    OutboundCallEligibility:
      type: object
      additionalProperties: false
      required: [eligible, reason]
      properties:
        eligible:
          type: boolean
        reason:
          type: string
    CallingVoicemail:
      type: object
      additionalProperties: false
      required: [outcome, taskId, durationSeconds]
      properties:
        outcome:
          type: string
          enum: [VOICEMAIL, MISSED_CALL]
        audioState:
          type: string
          enum: [PROCESSING, READY, UNAVAILABLE]
        taskId:
          type: string
          format: uuid
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
    CallingRecording:
      type: object
      additionalProperties: false
      required: [audioState, durationSeconds]
      properties:
        audioState:
          type: string
          enum: [PROCESSING, READY, UNAVAILABLE, EXPIRED, DELETED]
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
    VoicemailPlaybackCapability:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    RecordingPlaybackCapability:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    CallingCall:
      type: object
      additionalProperties: false
      required:
        - id
        - practiceId
        - locationId
        - locationName
        - direction
        - entryPoint
        - state
        - phone
        - phoneSource
        - displayName
        - nameSource
        - transferReason
        - reasonSource
        - providerTermination
        - endRequested
        - callerId
        - retryAllowed
        - version
      properties:
        id:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        direction:
          type: string
          enum: [INBOUND, OUTBOUND]
        entryPoint:
          type: string
          enum: [AI_HANDOFF, TASK, STANDALONE]
        taskId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - PREPARING
            - RINGING
            - CONNECTING
            - CONNECTED
            - VOICEMAIL_GREETING
            - VOICEMAIL_RECORDING
            - UNANSWERED
            - VOICEMAIL
            - MISSED
            - NEEDS_DISPOSITION
            - RESOLVED
            - FOLLOW_UP_REQUIRED
        dispositionDeadline:
          type: string
          format: date-time
        phone:
          type: string
        phoneSource:
          type: string
        displayName:
          type: string
        nameSource:
          type: string
        transferReason:
          type: string
        reasonSource:
          type: string
        providerTermination:
          type: string
        endRequested:
          type: boolean
        callerId:
          type: string
        retryOfCallId:
          type: string
          format: uuid
        retryAllowed:
          type: boolean
        connectedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        voicemail:
          $ref: "#/components/schemas/CallingVoicemail"
        recording:
          $ref: "#/components/schemas/CallingRecording"
        recoveryTask:
          $ref: "#/components/schemas/CallingRecoveryTask"
    CallingRecoveryTask:
      type: object
      additionalProperties: false
      required: [id, title, state, relatedInteractionCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        state:
          type: string
          enum: [OPEN, COMPLETED]
        relatedInteractionCount:
          type: integer
          minimum: 0
    CallingDispositionRequest:
      type: object
      additionalProperties: false
      required: [sessionId, outcome]
      properties:
        sessionId:
          type: string
          minLength: 1
        outcome:
          type: string
          enum:
            - RESOLVED
            - FOLLOW_UP_REQUIRED
            - COMPLETE_TASK
            - KEEP_OPEN
            - CREATE_TASK
            - NO_FOLLOW_UP
    CallingDispositionResult:
      type: object
      additionalProperties: false
      required: [call]
      properties:
        call:
          $ref: "#/components/schemas/CallingCall"
        taskId:
          type: string
          format: uuid
    StaffTaskCategory:
      type: string
      enum:
        - billing
        - appointments
        - documentation
        - optical
        - medication
        - referrals
        - other
    StaffTaskUrgency:
      type: string
      enum: [high_priority, normal, non_urgent]
    StaffTaskPatientCompatibility:
      type: object
      description: >
        Compatibility-only fields sent by the existing Abita tool. Acuity may
        source-label the optional name but never persists the ID or date of birth.
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 200
        dob:
          type: string
          maxLength: 64
    CreateStaffTaskRequest:
      type: object
      additionalProperties: false
      required:
        - callId
        - callerPhone
        - category
        - idempotencyKey
        - message
        - officeKey
        - officePhone
        - source
        - summary
        - urgency
      properties:
        callId:
          type: string
          minLength: 1
          maxLength: 255
        callerPhone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        category:
          $ref: "#/components/schemas/StaffTaskCategory"
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
        inboundOfficePhone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        message:
          type: string
          minLength: 1
          maxLength: 2500
        officeKey:
