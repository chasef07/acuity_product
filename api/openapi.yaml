      required: [currentJudgeVersion, days, week, reviewedCalls, goldenAnswers, goldenSet, rows, judgeDisagreements, reviewerDisagreements]
      properties:
        currentJudgeVersion:
          type: string
          description: The judge version new calls are scored with.
        days:
          type: array
          description: The current judge version's reviewed answers per review day over the last 7 review days, newest first. Built only from stored human reviews; shared calls the viewer has not reviewed are left out.
          items: {$ref: "#/components/schemas/OperatorGoldenSetDay"}
        week: {$ref: "#/components/schemas/OperatorGoldenSetCounts"}
        reviewedCalls: {type: integer}
        goldenAnswers: {type: integer}
        goldenSet:
          type: array
          items: {$ref: "#/components/schemas/OperatorGoldenSetCall"}
        rows:
          type: array
          items: {$ref: "#/components/schemas/OperatorJudgeAccuracyRow"}
        judgeDisagreements:
          type: array
          items: {$ref: "#/components/schemas/OperatorJudgeDisagreement"}
        reviewerDisagreements:
          type: array
          items: {$ref: "#/components/schemas/OperatorReviewerDisagreement"}
    OperatorGoldenSetCall:
      type: object
      additionalProperties: false
      required: [interactionId, startedAt, locationName, reviewers, answers, disagreements]
      properties:
        interactionId: {type: string, format: uuid}
        startedAt: {type: string, format: date-time}
        locationName: {type: string}
        reviewers:
          type: array
          items: {type: string}
        answers: {type: integer}
        disagreements: {type: integer}
    OperatorAICostQueryRequest:
      type: object
      additionalProperties: false
      required: [practiceId, range]
      properties:
        practiceId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        range: {$ref: "#/components/schemas/OperatorAIAnalyticsRange"}
    OperatorAICostItem:
      type: object
      additionalProperties: false
      required: [id, label, quantity, unit, rateUsd, rateQuantity, rateUnit, costUsd, sharePercent, calls]
      properties:
        id: {type: string}
        label: {type: string}
        quantity: {type: number, minimum: 0}
        unit: {type: string, enum: [tokens, characters, minutes]}
        rateUsd: {type: number, minimum: 0}
        rateQuantity: {type: number, exclusiveMinimum: 0}
        rateUnit: {type: string, enum: [tokens, characters, minute, hour]}
        costUsd: {type: number, nullable: true, minimum: 0}
        sharePercent:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Item cost divided by the recorded estimated subtotal, times 100. Null without a positive denominator or recorded usage.
        calls:
          type: integer
          minimum: 0
          description: Completed calls with recorded usage for this item.
    OperatorAICostDay:
      type: object
      additionalProperties: false
      required: [day, costUsd, calls, pricedCalls, unpricedUsage]
      properties:
        day: {type: string}
        costUsd: {type: number, minimum: 0}
        calls: {type: integer, minimum: 0}
        pricedCalls:
          type: integer
          minimum: 0
          description: Calls on this day with complete cost usage.
        unpricedUsage:
          type: integer
          minimum: 0
          description: Usage entries on this day excluded because their model or quantity could not be priced.
    OperatorAICostAnalytics:
      type: object
      additionalProperties: false
      required: [from, through, timeZone, rateEffectiveDate, totalCalls, pricedCalls, unpricedUsage, totalCostUsd, costPerCallUsd, costPerMinuteUsd, cacheHitRate, cacheSavingsUsd, items, daily]
      properties:
        from: {type: string}
        through: {type: string}
        timeZone: {type: string}
        rateEffectiveDate:
          type: string
          format: date
          description: Effective date of the tariff used for all estimates in this report.
        totalCalls: {type: integer, minimum: 0}
        pricedCalls:
          type: integer
          minimum: 0
          description: Completed calls with all seven cost items known and no unpriced LLM, STT, or TTS usage.
        unpricedUsage:
          type: integer
          minimum: 0
          description: Usage entries with unrecognized provider/model rates or invalid quantities, excluded from cost estimates.
        totalCostUsd:
          type: number
          minimum: 0
          description: Sum of recorded estimated item costs at the report tariff, before credits. May be partial; inspect pricedCalls and item calls.
        costPerCallUsd:
          type: number
          nullable: true
          minimum: 0
          description: Average estimated cost across completed calls with complete cost usage.
        costPerMinuteUsd:
          type: number
          nullable: true
          minimum: 0
          description: Average estimated cost per call minute across completed calls with complete cost usage.
        cacheHitRate: {type: number, nullable: true, minimum: 0, maximum: 100}
        cacheSavingsUsd: {type: number, minimum: 0}
        items: {type: array, items: {$ref: "#/components/schemas/OperatorAICostItem"}}
        daily: {type: array, items: {$ref: "#/components/schemas/OperatorAICostDay"}}
    OperatorAICallIssueOutcome:
      type: string
      enum: [CONFIRMED, NOT_AN_ISSUE]
    OperatorAICallIssue:
      type: object
      additionalProperties: false
      required: [interactionId, phone, startedAt, reason, reportedBy, reportedAt]
      properties:
        interactionId: {type: string, format: uuid}
        phone: {type: string}
        startedAt: {type: string, format: date-time}
        reason: {$ref: "#/components/schemas/AgentCallIssueReason"}
        note: {type: string, description: "Staff explanation of what happened, when given."}
        reportedBy: {type: string}
        reportedAt: {type: string, format: date-time}
        review: {$ref: "#/components/schemas/OperatorAICallIssueReview"}
    OperatorAICallIssueReview:
      type: object
      additionalProperties: false
      required: [outcome, reviewedBy, reviewedAt]
      properties:
        outcome: {$ref: "#/components/schemas/OperatorAICallIssueOutcome"}
        reviewedBy: {type: string}
        reviewedAt: {type: string, format: date-time}
    OperatorAIAnalyticsRange:
      type: string
      enum: [24h, 7d, 30d]
    OperatorAIAnalyticsQueryRequest:
      type: object
      additionalProperties: false
      required: [practiceId, range]
      properties:
        failuresOnly:
          type: boolean
          description: Restrict calls to explicit failing judge answers from persisted scorecards v6-v8, using each version's failure-question catalog. Missing, unknown, not-applicable, contextual answers, and earlier numeric scorecards do not match. Applies before pagination; does not restrict summary distributions or other summary metrics.
        failingJudge:
          type: string
          maxLength: 80
          description: Restrict calls to explicit failures for this judge question key in the v6-v8 failure catalog. Implies failure filtering even when failuresOnly is false. Intersects intent and outcome filters.
        judgeResult:
          type: string
          enum: [pass, unjudged]
          description: Restrict calls by failure-judge coverage in the v6-v8 catalog. pass matches calls with at least one eligible boolean judge answer and no explicit failure; unjudged matches calls with no eligible boolean judge answer. Cannot be combined with failuresOnly or failingJudge. Intersects intent and outcome filters; does not restrict summary distributions.
        intent:
          $ref: "#/components/schemas/CallIntent"
        outcome:
          $ref: "#/components/schemas/CallOutcome"
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        range:
          $ref: "#/components/schemas/OperatorAIAnalyticsRange"
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    OperatorAIAnalyticsDay:
      type: object
      additionalProperties: false
      required: [date, totalCalls, callMinutes, transferCount, newPatientIntentCalls, newPatientIntentBookings, existingPatientIntentCalls, existingPatientIntentBookings]
      properties:
        bookingCount: {type: integer, minimum: 0}
        cancellationCount: {type: integer, minimum: 0}
        rescheduleCount: {type: integer, minimum: 0}
        toolCallCount: {type: integer, minimum: 0}
        toolErrorCount: {type: integer, minimum: 0}
        newPatientIntentCalls:
          type: integer
          minimum: 0
          description: Calls labeled with the new_patient_booking intent.
        newPatientIntentBookings:
          type: integer
          minimum: 0
          description: Of newPatientIntentCalls, those with a confirmed BOOKING appointment outcome.
        existingPatientIntentCalls:
          type: integer
          minimum: 0
          description: Calls labeled with the existing_patient_booking intent.
        existingPatientIntentBookings:
          type: integer
          minimum: 0
          description: Of existingPatientIntentCalls, those with a confirmed BOOKING appointment outcome.
        date:
          type: string
          description: Eastern (America/New_York) call-start date in YYYY-MM-DD format. Boundary dates may cover partial days in the rolling range.
        totalCalls:
          type: integer
          minimum: 0
        callMinutes:
          type: number
          format: double
          minimum: 0
          description: Completed AI call time in minutes, from start to end. Calls still in progress contribute zero.
        transferCount:
          type: integer
          minimum: 0
          description: Calls with persisted ESCALATED status, matching the summary transfer count.
        transferRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Transferred calls divided by all AI calls on this date. Absent when there are no calls.
    OperatorAIAnalyticsSummary:
      type: object
      additionalProperties: false
      required:
        - daily
        - quality
        - versions
        - totalCalls
        - totalCallMinutes
        - bookingCount
        - cancellationCount
        - rescheduleCount
        - transferCount
        - transferRate
        - toolCallCount
        - toolErrorCount
        - toolFailureRate
      properties:
        daily:
          type: array
          description: All Eastern dates in the full selected range, including dates without calls; independent of call pagination.
          items: {$ref: "#/components/schemas/OperatorAIAnalyticsDay"}
        judges: {$ref: "#/components/schemas/OperatorAIAnalyticsJudges"}
        distributions: {$ref: "#/components/schemas/OperatorAIAnalyticsDistributions"}
        diagnostics: {$ref: "#/components/schemas/OperatorAIAnalyticsDiagnostics"}
        quality: {$ref: "#/components/schemas/OperatorAIAnalyticsQuality"}
        versions: {$ref: "#/components/schemas/OperatorAIAnalyticsVersions"}
        totalCalls:
          type: integer
          minimum: 0
        totalCallMinutes:
          type: number
          format: double
          minimum: 0
        bookingCount:
          type: integer
          minimum: 0
        cancellationCount:
          type: integer
          minimum: 0
        rescheduleCount:
          type: integer
          minimum: 0
        transferCount:
          type: integer
          minimum: 0
        transferRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
        toolCallCount:
          type: integer
          minimum: 0
        toolErrorCount:
          type: integer
          minimum: 0
        toolFailureRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
    OperatorAIAnalyticsJudges:
      type: object
      additionalProperties: false
      required: [version, totalCalls, reportedCalls, unavailableCalls, models, lineups, questions, pairs, yesAbove]
      description: Read-only observed judge evidence for the full selected practice, location, and date window, independent of pagination and intent, outcome, or failure filters. Includes only current v8 reports with complete or incomplete status and a unique, nonempty roster of nonblank model identifiers. Observed models and lineups are historical evidence, not a claim about current deployment configuration. Only current catalog boolean judge questions are counted; numerical sentiment is excluded.
      properties:
        version: {type: string}
        totalCalls: {type: integer, minimum: 0}
        reportedCalls:
          type: integer
          minimum: 0
          description: Calls with a supported report envelope. Individual questions may still be missing, invalid, or inapplicable.
        unavailableCalls:
          type: integer
          minimum: 0
          description: Calls excluded for missing, malformed, or unsupported-version reports; totalCalls minus reportedCalls.
        models:
          type: array
          items: {$ref: "#/components/schemas/OperatorAIJudgeModel"}
        lineups:
          type: array
          items: {$ref: "#/components/schemas/OperatorAIJudgeLineup"}
        questions:
          type: array
          description: Current boolean judge criteria with question-specific evidence. Status counts cover reportedCalls; excluded report envelopes do not enter question counts.
          items: {$ref: "#/components/schemas/OperatorAIJudgeQuestion"}
        pairs:
          type: array
          description: Model-pair comparisons summed across eligible boolean questions. A call can contribute several comparisons for the same pair. Includes valid observations from partial no-quorum reports; absent or invalid votes never count as disagreements.
          items: {$ref: "#/components/schemas/OperatorAIJudgePair"}
        yesAbove:
          type: number
          format: double
          description: A model votes yes only when its valid probability is strictly greater than this threshold. Consensus is majority yes/no; a tie uses whether the mean valid probability is strictly above this threshold.
    OperatorAIJudgeModel:
      type: object
      additionalProperties: false
      required: [model, votes, missingVotes]
      properties:
        model: {type: string}
        votes:
          type: integer
          minimum: 0
          description: Valid probabilities from this roster model over attempted boolean question opportunities.
        missingVotes:
          type: integer
          minimum: 0
          description: Attempted boolean question opportunities in reports listing this model where its vote is missing or invalid. Unknown, not-applicable, and unavailable questions without a recognizable vote map create no opportunity.
    OperatorAIJudgeLineup:
      type: object
      additionalProperties: false
      required: [models, requiredVotes, calls]
      properties:
        models: {type: array, items: {type: string}}
        requiredVotes:
          type: integer
          minimum: 1
          description: Floor of the observed roster size divided by two, plus one.
        calls: {type: integer, minimum: 0}
    OperatorAIJudgePair:
      type: object
      additionalProperties: false
      required: [left, right, compared, agreed, disagreed]
      description: Canonically sorted model identifiers. One comparison requires two finite probabilities within 0 through 1 on the same call and question, both from the report roster. agreed plus disagreed equals compared; agreement rate is agreed divided by compared. Pairs without shared valid votes are omitted.
      properties:
        left: {type: string}
        right: {type: string}
        compared: {type: integer, minimum: 0}
        agreed: {type: integer, minimum: 0}
        disagreed: {type: integer, minimum: 0}
    OperatorAIJudgeQuestion:
      type: object
      additionalProperties: false
      required: [key, label, prompt, question, yes, no, attempted, quorumMet, noQuorum, unknown, notApplicable, unavailable, pairs]
      description: Current catalog criteria. quorumMet, noQuorum, unknown, notApplicable, and unavailable are mutually exclusive and sum to reportedCalls. attempted is a separate count of recognized result or no_quorum vote maps, including maps whose malformed consensus is unavailable. Valid model observations remain comparable even when the stored consensus is unavailable.
      properties:
        key: {type: string}
        label: {type: string}
        prompt: {type: string}
        question: {type: string}
        yes: {type: string}
        no: {type: string}
        attempted: {type: integer, minimum: 0}
        quorumMet:
          type: integer
          minimum: 0
          description: Successful results with enough valid roster votes, a valid consensus probability, and a stored verdict consistent with majority and tie-break rules.
        noQuorum:
          type: integer
          minimum: 0
          description: Explicit no_quorum errors whose valid roster vote count is below the required count.
        unknown: {type: integer, minimum: 0}
        notApplicable: {type: integer, minimum: 0}
        unavailable:
          type: integer
          minimum: 0
          description: Missing or malformed question results, unrecognized errors, or contradictory quorum/verdict evidence in supported reports.
        pairs:
          type: array
          items: {$ref: "#/components/schemas/OperatorAIJudgePair"}
    OperatorAIAnalyticsDistributions:
      allOf:
        - $ref: "#/components/schemas/OperatorAIAnalyticsDistributionCounts"
        - type: object
          required: [daily, paths]
          properties:
            daily:
              type: array
              description: Every Eastern date in the selected reporting window, including zero-call dates, in ascending order. Daily category and coverage counts sum to the aggregate distribution counts.
              items: {$ref: "#/components/schemas/OperatorAIAnalyticsDistributionDay"}
            paths:
              type: array
              description: Every call's full route through intent, outcome, judge evaluation, and failed judges, grouped into identical routes and ordered by descending calls then route. Path calls sum to totalCalls. Uses the same labels, judge catalog, and intent and outcome filters as the aggregate counts.
              items: {$ref: "#/components/schemas/OperatorAIPathCount"}
    OperatorAIAnalyticsDistributionDay:
      allOf:
        - $ref: "#/components/schemas/OperatorAIAnalyticsDistributionCounts"
        - type: object
          required: [date]
          properties:
            date: {type: string, description: Eastern calendar date in YYYY-MM-DD format.}
    OperatorAIAnalyticsDistributionCounts:
      type: object
      required: [totalCalls, intents, outcomes, failures, unlabeledIntentCalls, unlabeledOutcomeCalls, evaluatedCalls, failedCalls, unevaluatedCalls]
      description: Full date-window distributions within the selected practice, location, intent, and outcome. Intent and outcome filters intersect using exact persisted labels; missing labels do not match named filters. Call pagination and failure filters do not restrict these counts. Other summary metrics retain their full practice, location, and date scope. Only observed categories are returned, ordered by descending calls then category key. Counts retain valid partial classifications regardless of labeling status; each label distribution plus its unlabeled count equals this object's totalCalls.
      properties:
        totalCalls:
          type: integer
          minimum: 0
          description: Calls matching the selected intent and outcome within this reporting window or date; denominator for this object's label distributions and evaluation coverage.
        intents:
          type: array
          items: {$ref: "#/components/schemas/OperatorAIIntentCount"}
        outcomes:
          type: array
          items: {$ref: "#/components/schemas/OperatorAIOutcomeCount"}
        failures:
          type: array
          description: Distinct calls per eligible failure judge question, collapsed across scorecard versions v6-v8 using the same catalog and normalized judge answers as failuresOnly and failingJudge. An explicit false answer is a failure. A call may appear in multiple categories; category shares use the sum of these counts.
          items: {$ref: "#/components/schemas/OperatorAIFailureCount"}
        unlabeledIntentCalls:
          type: integer
          minimum: 0
          description: Calls without a persisted intent, including missing or partial classifications.
        unlabeledOutcomeCalls:
          type: integer
          minimum: 0
          description: Calls without a persisted outcome, including missing or partial classifications.
        evaluatedCalls:
          type: integer
          minimum: 0
          description: Distinct calls with at least one persisted boolean judge answer for an eligible failure question in its v6-v8 catalog. Does not imply every question was evaluated. Context questions, code answers, older numeric scorecards, unknown answers, and not-applicable answers are excluded.
        failedCalls:
          type: integer
          minimum: 0
          description: Distinct calls with at least one eligible explicit false judge answer.
        unevaluatedCalls:
          type: integer
          minimum: 0
          description: totalCalls minus evaluatedCalls; absence of usable failure-judge evidence is not a passing result.
    OperatorAIPathCount:
      type: object
      additionalProperties: false
      required: [evaluated, failures, calls]
      properties:
        intent: {$ref: "#/components/schemas/CallIntent"}
        outcome: {$ref: "#/components/schemas/CallOutcome"}
        evaluated:
          type: boolean
          description: True when the call has at least one eligible boolean failure-judge answer, as in evaluatedCalls.
        failures:
          type: array
          description: Sorted eligible failure question keys with an explicit false answer; empty when none failed.
          items: {type: string}
        calls: {type: integer, minimum: 0}
    OperatorAIIntentCount:
      type: object
      additionalProperties: false
      required: [intent, calls]
      properties:
        intent: {$ref: "#/components/schemas/CallIntent"}
        calls: {type: integer, minimum: 0}
    OperatorAIOutcomeCount:
      type: object
      additionalProperties: false
      required: [outcome, calls]
      properties:
        outcome: {$ref: "#/components/schemas/CallOutcome"}
        calls: {type: integer, minimum: 0}
    OperatorAIFailureCount:
      type: object
      additionalProperties: false
      required: [key, label, calls]
      properties:
        key:
          type: string
          description: Eligible failure question key, accepted by the failingJudge filter.
        label:
          type: string
          description: Question label from the newest supported scorecard catalog containing this key.
        calls: {type: integer, minimum: 0}
    OperatorAICheckFlagCount:
      type: object
      additionalProperties: false
      required: [check, calls, scoredCalls]
      properties:
        check:
          type: string
          description: Evaluator check key, such as request_understood or conversation_responsive.
        calls:
          type: integer
          minimum: 0
          description: Calls this check flagged for review.
        scoredCalls:
          type: integer
          minimum: 0
          description: Calls where this check returned a usable score; errored, not-applicable, and absent checks are excluded.
    OperatorAIStaffFlagCounts:
      type: object
      additionalProperties: false
      required: [pending, confirmed, notAnIssue]
      description: Staff-flagged calls by Acuity review state.
      properties:
        pending: {type: integer, minimum: 0}
        confirmed: {type: integer, minimum: 0}
        notAnIssue: {type: integer, minimum: 0}
    OperatorAIContextFootprint:
      type: object
      additionalProperties: false
      required: [speakerPromptTokens, thinkerPromptTokens, toolSchemaTokens, toolCount]
      description: Static context the agent reported at session start, in tokenizer tokens. Excludes conversation history.
      properties:
        speakerPromptTokens: {type: integer, minimum: 0}
        thinkerPromptTokens: {type: integer, minimum: 0}
        toolSchemaTokens: {type: integer, minimum: 0}
        toolCount: {type: integer, minimum: 0}
    OperatorAIQualityDay:
      type: object
      additionalProperties: false
      required:
        - date
        - evaluatedCalls
        - unevaluatedCalls
        - flaggedCalls
        - checkFlags
        - staffFlags
        - sentimentCalls
        - sentimentCounts
        - tokenCalls
        - footprintCalls
      properties:
        date: {type: string, description: Eastern call-start date in YYYY-MM-DD format.}
        evaluatedCalls:
          type: integer
          minimum: 0
          description: Calls with a recognized evaluator result in which at least one red-flag check returned a usable score. Sentiment alone does not count.
        unevaluatedCalls:
          type: integer
          minimum: 0
          description: Calls with no usable red-flag check score (missing, skipped, unrecognized, or every check errored or not applicable). Never counted as clean.
        flaggedCalls:
          type: integer
          minimum: 0
          description: Evaluated calls with at least one check needing review.
        checkFlags:
          type: array
          items: {$ref: "#/components/schemas/OperatorAICheckFlagCount"}
        staffFlags: {$ref: "#/components/schemas/OperatorAIStaffFlagCounts"}
        sentimentCalls:
          type: integer
          minimum: 0
          description: Calls with a usable expressed-sentiment score, whether or not any red-flag check was scored.
        sentimentCounts:
          type: array
          minItems: 5
          maxItems: 5
          description: Calls by rounded expressed sentiment, index 0 (very negative) through 4 (very positive).
          items: {type: integer, minimum: 0}
        meanSentiment: {type: number, format: double, minimum: 0, maximum: 4}
        tokenCalls:
          type: integer
          minimum: 0
          description: Calls with recorded LLM token usage.
        p50InputTokens: {type: integer, minimum: 0}
        p90InputTokens: {type: integer, minimum: 0}
        p50CachedTokens: {type: integer, minimum: 0}
        p50OutputTokens: {type: integer, minimum: 0}
        footprintCalls:
          type: integer
          minimum: 0
          description: Calls that reported a context footprint.
        footprint: {$ref: "#/components/schemas/OperatorAIContextFootprint"}
    OperatorAIAnalyticsQuality:
      type: object
      additionalProperties: false
      required:
        - daily
        - evaluatedCalls
        - unevaluatedCalls
        - flaggedCalls
        - checkFlags
        - staffFlags
        - sentimentCalls
        - tokenCalls
        - footprintCalls
      properties:
        daily:
          type: array
          description: All Eastern dates in the selected range, matching summary daily.
          items: {$ref: "#/components/schemas/OperatorAIQualityDay"}
        evaluatedCalls:
          type: integer
          minimum: 0
          description: Calls with a recognized evaluator result in which at least one red-flag check returned a usable score. Sentiment alone does not count.
        unevaluatedCalls:
          type: integer
          minimum: 0
          description: Calls with no usable red-flag check score (missing, skipped, unrecognized, or every check errored or not applicable). Never counted as clean.
        flaggedCalls: {type: integer, minimum: 0}
        checkFlags:
          type: array
          items: {$ref: "#/components/schemas/OperatorAICheckFlagCount"}
        staffFlags: {$ref: "#/components/schemas/OperatorAIStaffFlagCounts"}
        sentimentCalls:
          type: integer
          minimum: 0
          description: Calls with a usable expressed-sentiment score, whether or not any red-flag check was scored.
        meanSentiment: {type: number, format: double, minimum: 0, maximum: 4}
        tokenCalls: {type: integer, minimum: 0}
        p50InputTokens: {type: integer, minimum: 0}
        p50CachedTokens: {type: integer, minimum: 0}
        p50OutputTokens: {type: integer, minimum: 0}
        footprintCalls: {type: integer, minimum: 0}
        latestFootprint: {$ref: "#/components/schemas/OperatorAIContextFootprint"}
    OperatorAIVersionDimension:
      type: string
      enum: [agent, prompts, tools, knowledge, judges, evaluator]
      description: Agent, prompts, tools, and knowledge change how calls behave; judges and evaluator change how calls are measured.
    OperatorAIVersionInEffect:
      type: object
      additionalProperties: false
      required: [dimension, version]
      properties:
        dimension: {$ref: "#/components/schemas/OperatorAIVersionDimension"}
        version: {type: string}
        locationId:
          type: string
          format: uuid
          description: Present for knowledge, which is published per office.
    OperatorAIVersionChange:
      type: object
      additionalProperties: false
      required: [dimension, version, previousVersion, firstSeenAt, date]
      properties:
        dimension: {$ref: "#/components/schemas/OperatorAIVersionDimension"}
        version: {type: string}
        previousVersion: {type: string}
        firstSeenAt:
          type: string
          format: date-time
          description: Start of the first call, on the day this version became the majority, served by this version.
        date: {type: string, description: Eastern call-start date on which this version first served the most calls, in YYYY-MM-DD format.}
        locationId:
          type: string
          format: uuid
          description: Present for knowledge, which is published per office.
    OperatorAIAnalyticsVersions:
      type: object
      additionalProperties: false
      required: [inEffect, changes]
      description: Versions recorded by calls. Per dimension (and per office for knowledge), each Eastern day's majority version is the one serving the most calls that day; a tie keeps the version in effect, else picks the tied version that served first. A change marks a day whose majority differs from the version in effect, and days without calls change nothing. Versions in effect at the start come from the latest call within 90 days before the range.
      properties:
        inEffect:
          type: array
          items: {$ref: "#/components/schemas/OperatorAIVersionInEffect"}
        changes:
          type: array
          items: {$ref: "#/components/schemas/OperatorAIVersionChange"}
    OperatorAIDiagnosticExample:
      type: object
      additionalProperties: false
