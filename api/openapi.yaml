          description: IANA timezone used for reporting-day boundaries.
    BookingMetrics:
      type: object
      additionalProperties: false
      required: [calls, bookings, searched, converted, conversion, p50, p90, durationSamples, searchEvidenceCalls, preciseSearchCalls]
      properties:
        calls:
          type: integer
        bookings:
          type: integer
          description: Distinct appointment identifiers backed by a confirmed Product BOOKING outcome and booked result in the selected completed-call cohort.
        searched:
          type: integer
          description: Unique completed calls with a get_availability execution that has a successful tool output, excluding calls whose Product outcome is RESCHEDULE or CANCELLATION. A completed search with no openings remains included.
        converted:
          type: integer
          description: Searched calls with a confirmed booking.
        conversion:
          type: number
          nullable: true
          description: Converted divided by searched, multiplied by 100. Null without a denominator.
        p50:
          type: number
          nullable: true
          description: Median call-start-to-hang-up duration in seconds across booked calls with valid timing evidence.
        p90:
          type: number
          nullable: true
          description: 90th percentile duration in seconds using linear interpolation.
        durationSamples:
          type: integer
        searchEvidenceCalls:
          type: integer
          description: Calls with recorded availability use or complete tool history.
        preciseSearchCalls:
          type: integer
          deprecated: true
          description: Deprecated rolling-deploy compatibility field. Always zero; use searched for the completed-search denominator.
