openapi: 3.0.3
info:
  title: Acuity Portal API
  version: 2026-07-27
  description: >
    Acuity Portal Access and HumanCalling interfaces with PostgreSQL authority,
    durable Telnyx commands and receipts, and disposable realtime hints.
servers:
  - url: https://api.acuity.example
    description: Deployment-supplied HTTPS origin
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Required runtime dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/access/sign-up-eligibility:
    post:
      operationId: inspectSignUpEligibility
      summary: Validate an invitation or provisioned Platform Operator email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpEligibilityRequest"
      responses:
        "200":
          description: The verified-email sign-up is eligible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/access:
    get:
      operationId: discoverAccess
      summary: Discover current Practice and Location authorization.
      responses:
        "200":
          description: Current Access authority from PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessDiscovery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invitations/inspect:
    post:
      operationId: inspectInvitation
      summary: Inspect only the scope attached to the presented invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCredentialRequest"
      responses:
        "200":
          description: Pending invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Atomically activate an invitation for the verified identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCredentialRequest"
      responses:
        "200":
          description: Membership and authorized scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: Load the authoritative empty workspace snapshot.
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized workspace snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/support-mode:
    post:
      operationId: enterSupportMode
      summary: Enter time-limited Support Mode for one Practice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterSupportModeRequest"
      responses:
        "201":
          description: Active Support Mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/support-mode/{supportSessionId}:
    delete:
      operationId: revokeSupportMode
      summary: Revoke the real operator's active Support Mode.
      parameters:
        - name: supportSessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Support Mode revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/practices/{practiceId}/locations:
    post:
      operationId: addLocation
      summary: Add a Location as a Platform Operator in Support Mode.
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLocationRequest"
      responses:
        "201":
          description: Committed Location mutation and audit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationMutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/events:
    get:
      operationId: getEvents
      summary: Stream disposable version hints for one authorized scope.
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Bounded text/event-stream. Initial connection and every reconnect
            require an authoritative workspace refetch.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/handoffs:
    post:
      operationId: createHandoff
      summary: Create one authenticated, idempotent Abita handoff.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHandoffRequest"
      responses:
        "201":
          description: Opaque single-use SIP handoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/provider/telnyx/webhooks:
    post:
      operationId: receiveTelnyxWebhook
      summary: Verify and durably receipt one raw Telnyx webhook.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Receipt durably committed or accepted duplicate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/softphone/lease:
    post:
      operationId: acquireSoftphone
      summary: Acquire, renew, or explicitly take over the User's softphone lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoftphoneLeaseRequest"
      responses:
        "200":
          description: Current softphone ownership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftphoneState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/readiness:
    put:
      operationId: setCallingReadiness
      summary: Commit the media-owning session's current technical readiness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingReadinessRequest"
      responses:
        "200":
          description: Current derived operational state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftphoneState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/media-token:
    post:
      operationId: issueCallingMediaToken
      summary: Issue a short-lived Telnyx JWT to the current softphone owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaTokenRequest"
      responses:
        "200":
          description: Short-lived browser media credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/offers:
    get:
      operationId: listCallingOffers
      summary: List every current offer the User may accept now.
      responses:
        "200":
          description: Earliest-deadline-first authoritative offers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingOfferList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/offers/{callId}/accept:
    post:
      operationId: acceptCallingOffer
      summary: Atomically claim one current offer and commit its Dial command.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCallingOfferRequest"
      responses:
        "200":
          description: Committed acceptance or explicit losing result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptCallingOfferResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}:
    get:
      operationId: getCallingCall
      summary: Read the winning User's durable active or disposition Call.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized Call workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/hangup:
    post:
      operationId: requestCallingHangup
      summary: Commit a provider hangup command without claiming termination.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingControlRequest"
      responses:
        "202":
          description: Hangup intent committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingCall"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/disposition:
    post:
      operationId: recordCallingDisposition
      summary: Resolve the provider-terminated Call and optionally ensure its one follow-up Task.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingDispositionRequest"
      responses:
        "200":
          description: Durable terminal Call outcome and optional linked Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingDispositionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calling/calls/{callId}/history:
    get:
      operationId: getCallingCallHistory
      summary: Read authorized exact-phone Call Engagement History for the active Call.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Newest page presented in chronological order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/query:
    post:
      operationId: queryTasks
      summary: Query the authorized Task rail with protected search input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskQueryRequest"
      responses:
        "200":
          description: Open-first Task rail page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{taskId}:
    get:
      operationId: readTask
      summary: Read one currently authorized Task.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current Task state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{taskId}/title:
    put:
      operationId: renameTask
      summary: Rename one open Task at its last observed version.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTaskRequest"
      responses:
        "200":
          description: Renamed Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: Complete one Task at its last observed version.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTransitionRequest"
      responses:
        "200":
          description: Completed or idempotently current Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{taskId}/reopen:
    post:
      operationId: reopenTask
      summary: Reopen one completed Task at its last observed version.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTransitionRequest"
      responses:
        "200":
          description: Reopened or idempotently current Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{taskId}/history:
    get:
      operationId: getTaskCallHistory
      summary: Read authorized exact-phone Call Engagement History for one Task.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Newest page presented in chronological order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/operator/calls/{callId}/timeline:
    get:
      operationId: getOperatorCallingTimeline
      summary: Read one sanitized durable Call timeline as a Platform Operator.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sanitized provider and workflow history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCallingTimeline"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Denied:
      description: Current identity lacks the requested authority.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The requested transition is no longer available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: A required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, role]
      properties:
        status:
          type: string
          enum: [ok]
        role:
          type: string
          enum: [portal-api, provider-ingress, realtime]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            retryable:
              type: boolean
    SignUpEligibilityRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        invitationToken:
          type: string
          minLength: 32
          maxLength: 256
    InvitationCredentialRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [kind, email, locations]
      properties:
        kind:
          type: string
          enum: [PRACTICE_INVITATION, PLATFORM_OPERATOR]
        email:
          type: string
          format: email
        practiceId:
          type: string
          format: uuid
        practiceName:
          type: string
        role:
          type: string
          enum: [ADMIN, STAFF]
        locationScope:
          type: string
          enum: [ALL, SELECTED]
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        expiresAt:
          type: string
          format: date-time
    Actor:
      type: object
      additionalProperties: false
      required: [subject, email, type]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
        type:
          type: string
          enum: [HUMAN, PLATFORM_OPERATOR]
    Practice:
      type: object
      additionalProperties: false
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
    Location:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Membership:
      type: object
      additionalProperties: false
      required: [id, role, locationScope]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, STAFF]
        locationScope:
          type: string
          enum: [ALL, SELECTED]
    SupportMode:
      type: object
      additionalProperties: false
      required: [id, practiceId, reason, startsAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        reason:
          type: string
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Authorization:
      type: object
      additionalProperties: false
      required: [actor, practice, locations, platformOperator]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        practice:
          $ref: "#/components/schemas/Practice"
        membership:
          $ref: "#/components/schemas/Membership"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        activeLocation:
          $ref: "#/components/schemas/Location"
        platformOperator:
          type: boolean
        supportMode:
          $ref: "#/components/schemas/SupportMode"
    PracticeAccess:
      allOf:
        - $ref: "#/components/schemas/Practice"
        - type: object
          additionalProperties: false
          required: [locations]
          properties:
            membership:
              $ref: "#/components/schemas/Membership"
            locations:
              type: array
              items:
                $ref: "#/components/schemas/Location"
    AccessDiscovery:
      type: object
      additionalProperties: false
      required: [actor, platformOperator, practices]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        platformOperator:
          type: boolean
        practices:
          type: array
          items:
            $ref: "#/components/schemas/PracticeAccess"
    WorkspaceSnapshot:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - version
        - state
        - actor
        - practice
        - location
        - navigation
        - platformOperator
      properties:
        schemaVersion:
          type: string
          enum: ["2026-07-24"]
        version:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum: [EMPTY]
        actor:
          $ref: "#/components/schemas/Actor"
        practice:
          $ref: "#/components/schemas/Practice"
        location:
          $ref: "#/components/schemas/Location"
        membership:
          $ref: "#/components/schemas/Membership"
        platformOperator:
          type: boolean
        supportMode:
          $ref: "#/components/schemas/SupportMode"
        navigation:
          type: array
          items:
            $ref: "#/components/schemas/NavigationItem"
    NavigationItem:
      type: object
      additionalProperties: false
      required: [id, label, enabled]
      properties:
        id:
          type: string
          enum: [tasks, call-center, recordings, settings]
        label:
          type: string
        enabled:
          type: boolean
    EnterSupportModeRequest:
      type: object
      additionalProperties: false
      required: [practiceId, reason, durationMinutes]
      properties:
        practiceId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 240
    AddLocationRequest:
      type: object
      additionalProperties: false
      required: [supportSessionId, key, name]
      properties:
        supportSessionId:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorSubject, practiceId, supportSessionId, action, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorSubject:
          type: string
        practiceId:
          type: string
          format: uuid
        supportSessionId:
          type: string
          format: uuid
        action:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    LocationMutation:
      type: object
      additionalProperties: false
      required: [location, practiceVersion, audit]
      properties:
        location:
          $ref: "#/components/schemas/Location"
        practiceVersion:
          type: integer
          format: int64
        audit:
          $ref: "#/components/schemas/AuditEvent"
    ContactContextInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        phoneSource:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 200
        nameSource:
          type: string
          maxLength: 100
        transferReason:
          type: string
          maxLength: 500
        reasonSource:
          type: string
          maxLength: 100
    CreateHandoffRequest:
      type: object
      additionalProperties: false
      required: [practiceId, locationId, sourceCallId, idempotencyKey, contact]
      properties:
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        sourceCallId:
          type: string
          minLength: 1
          maxLength: 200
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
        contact:
          $ref: "#/components/schemas/ContactContextInput"
    Handoff:
      type: object
      additionalProperties: false
      required: [id, sipDestination, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        sipDestination:
          type: string
        expiresAt:
          type: string
          format: date-time
    SoftphoneLeaseRequest:
      type: object
      additionalProperties: false
      required: [sessionId, takeover]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        takeover:
          type: boolean
    CallingReadinessRequest:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - registered
        - microphoneReady
        - audioReady
        - sessionHealthy
        - available
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
        registered:
          type: boolean
        microphoneReady:
          type: boolean
        audioReady:
          type: boolean
        sessionHealthy:
          type: boolean
        available:
          type: boolean
    SoftphoneState:
      type: object
      additionalProperties: false
      required: [sessionId, leaseExpiresAt, owner, available, activeCallId]
      properties:
        sessionId:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
        owner:
          type: boolean
        available:
          type: boolean
        activeCallId:
          type: string
          description: The User's current durable Call, or empty when capacity is free.
    MediaTokenRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
    MediaToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    CallingOffer:
      type: object
      additionalProperties: false
      required:
        - id
        - practiceId
        - locationId
        - locationName
        - displayName
        - nameSource
        - transferReason
        - reasonSource
        - deadline
        - state
        - version
      properties:
        id:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        displayName:
          type: string
        nameSource:
          type: string
        transferReason:
          type: string
        reasonSource:
          type: string
        deadline:
          type: string
          format: date-time
        state:
          type: string
          enum: [OFFERING]
        version:
          type: integer
          format: int64
          minimum: 1
    CallingOfferList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CallingOffer"
    AcceptCallingOfferRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
    CallingControlRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 200
    AcceptCallingOfferResult:
      type: object
      additionalProperties: false
      required: [status, callId, state]
      properties:
        status:
          type: string
          enum: [ACCEPTED, ALREADY_CLAIMED, EXPIRED, INELIGIBLE]
        callId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - OFFERING
            - CONNECTING
            - CONNECTED
            - RECONCILING
            - UNANSWERED
            - NEEDS_DISPOSITION
            - RESOLVED
            - FOLLOW_UP_REQUIRED
    CallingRecording:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [INTENDED, RECORDING, READY, FAILED]
        failureCode:
          type: string
    CallingCall:
      type: object
      additionalProperties: false
      required:
        - id
        - practiceId
        - locationId
        - locationName
        - state
        - deadline
        - phone
        - phoneSource
        - displayName
        - nameSource
        - transferReason
        - reasonSource
        - expectedStaffLegId
        - expectedMediaToken
        - providerTermination
        - version
      properties:
        id:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        state:
          type: string
          enum:
            - CONNECTING
            - CONNECTED
            - RECONCILING
            - UNANSWERED
            - NEEDS_DISPOSITION
            - RESOLVED
            - FOLLOW_UP_REQUIRED
        deadline:
          type: string
          format: date-time
        phone:
          type: string
        phoneSource:
          type: string
        displayName:
          type: string
        nameSource:
          type: string
        transferReason:
          type: string
        reasonSource:
          type: string
        expectedStaffLegId:
          type: string
          description: Empty until Telnyx identifies the one staff leg created for this claim.
        expectedMediaToken:
          type: string
          description: Opaque token that identifies the exact WebRTC media leg for the current claim.
        providerTermination:
          type: string
        connectedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        recording:
          $ref: "#/components/schemas/CallingRecording"
    CallingDispositionRequest:
      type: object
      additionalProperties: false
      required: [sessionId, outcome]
      properties:
        sessionId:
          type: string
          minLength: 1
        outcome:
          type: string
          enum: [RESOLVED, FOLLOW_UP_REQUIRED]
    CallingDispositionResult:
      type: object
      additionalProperties: false
      required: [call]
      properties:
        call:
          $ref: "#/components/schemas/CallingCall"
        taskId:
          type: string
          format: uuid
    TaskActor:
      type: object
      additionalProperties: false
      required: [subject, email]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - practiceId
        - locationId
        - locationName
        - callId
        - phone
        - title
        - state
        - createdBy
        - createdAt
        - version
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        callId:
          type: string
          format: uuid
        phone:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [OPEN, COMPLETED]
        createdBy:
          $ref: "#/components/schemas/TaskActor"
        createdAt:
          type: string
          format: date-time
        completedBy:
          $ref: "#/components/schemas/TaskActor"
        completedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    TaskPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: string
    TaskQueryRequest:
      type: object
      additionalProperties: false
      required: [practiceId]
      properties:
        practiceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        search:
          type: string
          maxLength: 500
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 50
    RenameTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, title]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 500
        supportSessionId:
          type: string
          format: uuid
    TaskTransitionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        supportSessionId:
          type: string
          format: uuid
    CallHistoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - direction
        - startedAt
        - durationSeconds
        - locationId
        - locationName
        - answeredByEmail
        - transferReason
        - outcome
        - current
        - originating
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CALL]
        direction:
          type: string
          enum: [INBOUND]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        answeredByEmail:
          type: string
        transferReason:
          type: string
        outcome:
          type: string
          enum:
            - OFFERING
            - CONNECTING
            - CONNECTED
            - RECONCILING
            - UNANSWERED
            - NEEDS_DISPOSITION
            - RESOLVED
            - FOLLOW_UP_REQUIRED
        current:
          type: boolean
        originating:
          type: boolean
    CallHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CallHistoryItem"
        nextCursor:
          type: string
    OperatorCallingTimelineEntry:
      type: object
      additionalProperties: false
      required:
        - kind
        - opaqueReference
        - errorCode
        - commandAction
        - commandState
        - commandAttempts
        - receiptState
        - ageSeconds
        - occurredAt
      properties:
        kind:
          type: string
        opaqueReference:
          type: string
        errorCode:
          type: string
        commandAction:
          type: string
        commandState:
          type: string
        commandAttempts:
          type: integer
          minimum: 0
        receiptState:
          type: string
        ageSeconds:
          type: integer
          format: int64
          minimum: 0
        occurredAt:
          type: string
          format: date-time
    OperatorCallingTimeline:
      type: object
      additionalProperties: false
      required: [callId, practiceId, state, version, entries]
      properties:
        callId:
          type: string
          format: uuid
        practiceId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - OFFERING
            - CONNECTING
            - CONNECTED
            - RECONCILING
            - UNANSWERED
            - NEEDS_DISPOSITION
            - RESOLVED
            - FOLLOW_UP_REQUIRED
        version:
          type: integer
          format: int64
          minimum: 1
        entries:
          type: array
          items:
            $ref: "#/components/schemas/OperatorCallingTimelineEntry"
security:
  - bearerAuth: []
