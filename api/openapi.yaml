    OperatorJuryTrust:
      type: object
      additionalProperties: false
      description: >-
        Daily-queue reviews weighted by each sample's share of that day's calls, so oversampling
        flagged calls does not flatter the jury. Bounds are 95% Wilson bounds on the effective sample size.
        The jury says no when its majority verdict is no. Trusted needs catch low bound >= 90%, false-alarm high bound <= 5%, agreement low bound within
        5 points of reviewer-reviewer agreement (20+ shared reviews), and the last 14 days passing too.
      required: [calls, failures, catch, catchLow, falseAlarms, falseAlarmHigh, agreement, agreementLow, humanAgreement, humanPairs, status, reason]
      properties:
        calls: {type: integer}
        failures: {type: integer}
        catch: {type: number, nullable: true}
        catchLow: {type: number, nullable: true}
        falseAlarms: {type: number, nullable: true}
        falseAlarmHigh: {type: number, nullable: true}
        agreement: {type: number, nullable: true}
        agreementLow: {type: number, nullable: true}
        humanAgreement: {type: number, nullable: true}
        humanPairs: {type: integer}
        status: {type: string, enum: [trusted, collecting, below]}
        reason: {type: string}
