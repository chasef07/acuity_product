  - id: "medical-records-requests"
    title: "Medical records requests"
    text: |-
      Records intake identifies whether the requester is a patient, medical office, or attorney office, and which records are requested. Patient callers provide their full name and date of birth; medical-office callers provide the office and requesting doctor's names. Preserve available patient details separately from requester details, without claiming identity verification.
      Preserve applicable collected details and explicitly list missing details or prerequisites in the staff request, even when intake is incomplete. Submitting the request means staff review, not records delivery or verified authorization.
  - id: "attorney-records-requests"
    title: "Attorney records requests"
    text: |-
      Attorney offices must fax both the records request and patient authorization before fulfillment. Ask whether each was faxed (yes, no, or unknown) and when each was sent. If either is missing, explain the fax prerequisite. Caller-reported sending does not establish office receipt or valid authorization.
      Use only a supplied office fax number; do not invent one.
  - id: "records-delivery"
    title: "Medical records delivery to patients and offices"
    text: |-
      For requested fax delivery, collect the destination fax number. For patient email delivery, collect the complete email address. Only a visit summary may be emailed to patients; full visit notes cannot. Preserve a request for full notes and its delivery preference for staff clarification; do not silently substitute a summary or promise another delivery method is approved.
  - id: "prescription-copies"
    title: "Copies of glasses or contact lens prescriptions"
    text: |-
      A glasses or contact-lens prescription copy is an optical request, rather than a full medical-records request. How prescription copies are delivered and how long they take are not supplied.
  - id: "contact-lenses"
    title: "Contact lenses and phone orders"
    text: |-
      If a patient wants contact lenses and already has a prescription, they can bring the prescription from their optometrist. Patients needing a prescription can obtain one through an optometrist appointment.
      If the patient's contact lens prescription is on file, the office can take a contact lens order over the phone with payment.
  - id: "contact-lens-prescription-validity"
    title: "Contact lens prescription validity"
    text: |-
      Contact lens prescriptions are valid for up to 1 year.
  - id: "frame-brands"
    title: "Glasses frame brands"
    text: |-
      North Miami Beach Optical stocks many major frame brands, including Gucci, Montblanc, YSL, Ray-Ban, Emporio Armani, and Cartier.
  - id: "titanium-frames"
    title: "Titanium frames"
    text: |-
      For titanium frames, North Miami Beach Optical carries Mykita, Lindberg, and Nike Flexon.
  - id: "meta-eyewear"
    title: "Meta smart glasses"
    text: |-
      North Miami Beach Optical carries Meta eyewear from both Ray-Ban and Oakley.
  - id: "lens-options"
    title: "Lens upgrades and treatments"
    text: |-
      The office offers all types of lenses, including lens upgrades and treatments.
  - id: "outside-prescriptions"
    title: "Outside eyeglass prescriptions"
    text: |-
      If a patient wants glasses and already has a prescription, they can bring the prescription from their optometrist and choose from the office's frame selection. Patients needing a prescription can obtain one through an optometrist appointment.
  - id: "eyeglass-prescription-validity"
    title: "Eyeglass prescription validity"
    text: |-
      Eyeglass prescriptions are valid for up to 2 years, but a yearly eye exam is recommended to make sure the prescription is current and the patient has the right lenses to improve their vision.
  - id: "glasses-turnaround"
    title: "How long glasses take to be ready"
    text: |-
      Glasses are usually ready in less than 10 business days.
  - id: "glasses-pickup"
    title: "Glasses pickup and ready text"
    text: |-
      Glasses pickup policy: a readiness text confirms glasses are ready for pickup; patients wait for that text before coming in. This policy does not establish an individual order's readiness.
  - id: "frame-adjustments"
    title: "Glasses adjustments"
    text: |-
      Optical handles frame adjustments, and adjustments are free. No appointment is needed to have current glasses adjusted.
  - id: "repairs-and-warranty"
    title: "Broken glasses repair and warranty"
    text: |-
      Frames include a two- or three-year warranty.
      Broken glasses and warranty questions require an in-person inspection of the frame or lenses.
