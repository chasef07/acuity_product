  - id: "scope-of-services"
    title: "Services at North Miami Beach Optical"
    text: |-
      North Miami Beach Optical is an optical-only office. It handles routine eye exams, glasses, contact lenses, prescriptions, frames, lenses, lens upgrades, adjustments, repairs, and payments.
      The office accepts outside prescriptions and can schedule an eye exam with one of its professional optometrists.
      Medical eye care, ophthalmology visits, surgery questions, urgent symptoms, and eye-problem care are not offered through this office. Medical insurance checks are not supported for this office.
  - id: "routine-vision-and-children"
    title: "Age limits for children's eye exams"
    text: |-
