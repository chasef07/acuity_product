  - id: "source-and-demo-limitations"
    title: "Source and Demo Limitations"
    text: |-
      Public facts checked September 6, 2026: https://newtampaeyes.com/ ; https://newtampaeyes.com/about-us/ ; https://newtampaeyes.com/contact-location/wesley-chapel/ ; https://newtampaeyes.com/contact-location/dade-city/ . Provider service routing is a simplified demo policy based on the public specialties and the requested routine-exam scenario, not a clinical protocol. This demo uses real practice identity with a shared demo calendar, demonstration insurance rules, a demo transfer destination, and simulated after-hours notification. It does not establish a live practice integration, clinical suitability, coverage, delivery, or a completed booking.
  - id: "what-to-bring"
