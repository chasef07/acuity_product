entries:
  - id: "scope-of-services"
    title: "Services and New Patients"
    text: |-
      Isla Community Health is a nonprofit Federally Qualified Health Center serving Saipan and Tinian. Services listed on its website include primary care, pediatrics, women's health, and mental health.
      Patients do not have to live in a clinic's neighborhood to register. Specific age limits, referral requirements, and service availability at each clinic require staff confirmation. A rheumatology specialty service is not established by the website.
  - id: "location-and-contact"
    title: "Clinic Locations and Phone Numbers"
    text: |-
      Kagman Isla Community Health: 6690 Kagman Road, Kagman, Saipan. Phone: +1 670-287-6721.
      Southern Isla Community Health: 856 Chalan Tun Thomas P. Sablan Road, San Antonio, Saipan. Phone: +1 670-234-5242.
      Tinian Isla Community Health: 520520 Canal Street, San Jose, Tinian. Phone: +1 670-783-7102.
      These are published clinic contacts, not confirmation that an automated booking or transfer reaches a particular clinic.
  - id: "hours"
    title: "Published Clinic Hours"
    text: |-
      Kagman: Monday through Friday, 8 AM to 3 PM; closed Saturday and Sunday.
      Southern: Monday through Thursday, 8 AM to 4 PM; Friday and Saturday, 8 AM to noon; closed Sunday.
      Tinian: Monday, Wednesday, and Friday, 9 AM to 4 PM; closed Tuesday, Thursday, Saturday, and Sunday.
      The website labels this schedule "Business Hours (August)." These are published reference hours, not verified current hours or appointment availability. Confirm current hours with the clinic before travel. The September 16, 2026 staff-training closure has passed and is not an ongoing closure.
  - id: "appointment-expectations"
    title: "New Appointments and Follow-Up Visits"
    text: |-
      Patients can call a clinic to request a new appointment or follow-up. The useful intake details are the reason for the visit and preferred clinic: Kagman, Southern, or Tinian.
      A specific location, provider, service, or time is confirmed only by a successful scheduling result that supports it. Otherwise, staff must coordinate the appointment. Published office hours are not available appointment slots.
      Required forms, advance-arrival time, walk-in rules, and clinic-specific new-patient requirements are not supplied in this reference and require staff confirmation.
  - id: "telemedicine"
    title: "Telemedicine and Appointment Changes"
    text: |-
      Patients can ask a clinic to change an existing appointment to telemedicine. Staff must confirm suitability, availability, and the appointment change; a request does not complete the change.
      The website says prescriptions can be sent to the patient's chosen pharmacy following telemedicine care. A clinician decides whether to prescribe; a visit or request does not guarantee a prescription.
  - id: "insurance-and-referrals"
    title: "Insurance Plans and Coverage"
    text: |-
      Isla's FAQ lists Medicaid, Medicare, Aetna, Staywell, Netcare, TriCare, TakeCare, and Calvo's.
      This is a published general list, not verification of an individual's plan, network, benefits, or payment. Staff or the insurer must confirm the exact plan, coverage, costs, referral requirements, and authorizations. The generic demo insurance catalog does not establish Isla participation.
  - id: "self-pay-pricing"
    title: "Uninsured Patients and Sliding Fees"
    text: |-
      Isla offers a sliding fee program for eligible patients that considers income, family size, and other eligibility factors for services and prescription medications. Patients without insurance can ask staff about applying.
      Exact fees, eligibility decisions, required financial documents, and discounts require staff confirmation. There is no supplied fixed self-pay price or guarantee of free care.
  - id: "providers"
    title: "Care Team"
    text: |-
      The website lists physicians Anthony Stearns, MD; Tiffany Willis, MD; Nicole Joyner-Powell, DO; and Daniel Lamar, MD; physician assistant Alexander Johanson, PA; nurse practitioners Jihyun Kim, NP, Roca Sablan, NP, and Aurelia Long, NP; and licensed professional counselor Maira Arriola, LPC.
      Provider schedules, clinic assignments, specialties beyond these published credentials, and availability for new patients require staff confirmation.
  - id: "medication-requests"
    title: "Prescription and Refill Requests"
    text: |-
      Refill, pharmacy-change, prescription-status, and medication-authorization requests need staff review. Useful request details include the medication name, strength and directions as reported, pharmacy, requested action, and remaining supply when known. Submission does not confirm prescription approval or completion.
      Personal medication advice, dose changes, interactions, reactions, and urgent medication concerns require clinical staff. This reference does not supply medication education or treatment recommendations.
  - id: "transportation"
    title: "Help Getting to the Clinic"
    text: |-
      The website advertises ride assistance at +1 670-256-5242. Staff must confirm eligibility, availability, and pickup arrangements. A transportation request is not a reserved ride.
  - id: "billing"
    title: "Billing Questions"
    text: |-
      Staff can help route billing and account questions. This reference does not supply a dedicated billing number, accepted payment methods, or account-resolution timelines. Do not collect payment-card information during the call.
  - id: "records-and-forms"
    title: "Medical Records and Visit Preparation"
    text: |-
      Required intake documents, medical-records release requirements, approved delivery methods, and records fees are not supplied in this reference. Staff must confirm the applicable policy. Do not promise records by email or invent a submission method.
  - id: "after-hours"
    title: "After-Hours Help"
    text: |-
      An after-hours clinical contact, on-call schedule, and callback time are not supplied in this reference. Urgent clinical questions require clinical care rather than a promised routine callback. For a life-threatening emergency, call 911.
