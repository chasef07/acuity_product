  - id: "scope-of-services"
    title: "Services at the Crystal River office"
    text: |-
      Crystal River is a medical-only office. It sees medical eye conditions such as cataract evaluations, glaucoma, eyelid concerns, and flashes or floaters. For cataract evaluations and other medical visits, Crystal River can schedule the in-office evaluation when appropriate. Other tests, procedures, and specialty services are not supplied here.
      Crystal River does not see pediatric ophthalmology and does not schedule routine-vision exams, glasses prescriptions, or contact lens prescriptions.
  - id: "cataract-provider"
    title: "Cataract visits and evaluations"
    text: |-
      Dr. Licht is the only provider for all cataract visits at Crystal River, including cataract evaluations.
  - id: "appointment-confirmation"
    title: "Appointment confirmation email"
    text: |-
      The practice typically sends an email confirmation after scheduling an appointment.
  - id: "new-patient-visit"
    title: "New patient visit duration and dilation"
    text: |-
      New patient visits may take 1–2 hours depending on testing. Eye dilation may occur and can temporarily cause blurry vision and light sensitivity.
  - id: "what-to-bring"
    title: "What to bring to the appointment"
    text: |-
      Photo ID, insurance card, list of current medications, previous eye records (if available).
  - id: "referral-requirements"
    title: "Referral requirements"
    text: |-
      Plan acceptance is separate from coverage for a specific visit or procedure.
      Referral and authorization requirements depend on the patient's insurance policy. Insurance verification may be required before appointment confirmation.
  - id: "billing"
    title: "Billing department phone number for bills and balances"
    text: |-
      Billing department phone: (786) 446-8333. The billing department handles every billing-related question.
  - id: "payments"
    title: "Payments and financing (CareCredit)"
    text: |-
      Visit costs vary based on insurance and appointment type. Coverage details are determined after insurance verification. Payment handling is owned by the billing department. Financing options such as CareCredit are not supplied.
  - id: "self-pay-pricing"
    title: "Self-pay prices without insurance"
    text: |-
      New patient medical visit with an optometrist: $150. Established patient medical visit with an optometrist: $75. New patient medical visit with an ophthalmologist: $250. Established patient medical visit with an ophthalmologist: $125. Crystal River does not schedule routine vision exams or contact lens fittings.
  - id: "medical-records-requests"
    title: "Medical records requests"
    text: |-
      Medical records request requirements are not supplied for the Crystal River office.
  - id: "prescription-copies"
    title: "Copies of glasses or contact lens prescriptions"
    text: |-
      Crystal River does not schedule glasses prescriptions or contact lens prescriptions. How prescription copies are delivered and how long they take are not supplied.
  - id: "contact-lenses"
    title: "Contact lenses"
    text: |-
      Crystal River does not schedule contact lens prescriptions or fittings.
  - id: "glasses-pickup"
    title: "Glasses pickup and ready text"
    text: |-
      Glasses pickup policy: a readiness text confirms glasses are ready for pickup; patients wait for that text before coming in. This policy does not establish an individual order's readiness.
  - id: "repairs-and-warranty"
    title: "Broken glasses repair and warranty"
    text: |-
      Patients with broken glasses or warranty questions should bring their glasses to the Spring Hill location. Staff will review the glasses and determine what options may be available. Warranty coverage and repair options are evaluated in person.
