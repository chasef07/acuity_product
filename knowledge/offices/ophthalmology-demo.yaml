  - id: "location-and-contact"
    title: "Frantz EyeCare locations and contact"
    text: |-
      Frantz EyeCare serves Southwest Florida. Website: https://www.bettervision.net. Published main phone: (239) 418-0999. Callers on this route have already reached the front desk; help them on this call.
      Fort Myers: 9617 Gulf Research Lane, Fort Myers, FL 33912.
      Cape Coral: 2301 Del Prado Blvd S #630, Cape Coral, FL 33990.
      North Naples: 1201 Piper Blvd. #22, Naples, FL 34110.
      Naples: 2500 Goodlette-Frank Rd, Naples, FL 34103.
      Lehigh Acres: 3020 Lee Blvd., Unit 12, Lehigh Acres, FL 33971.
      Punta Gorda: 109 Taylor Street, Punta Gorda, FL 33950.
      South Naples: 7075 Radio Rd, Naples, FL 34104.
      Ask which location the caller means before giving an address. A listed office does not establish appointment availability there.
      Source: https://www.bettervision.net/locations/ (checked September 14, 2026).
  - id: "hours"
    title: "Office hours"
    text: |-
      The website lists all seven offices as open Monday through Friday, 8 AM to 5 PM Eastern Time. Holiday, weekend, and individual provider schedules are not confirmed here.
      Source: https://www.bettervision.net/locations/ (checked September 14, 2026).
  - id: "providers"
    title: "Cataract specialists and other ophthalmologists"
    text: |-
      Cataract specialists: Jonathan M. Frantz, MD, FACS (cataract and refractive); Maxwell A. Burch, MD (cataract, cornea, refractive); Manik Goel, MD (glaucoma and cataract); Boyd Vaziri, MD (refractive cornea and cataract).
      Other specialists: Yamini Attiku, MD (medical retina and uveitis); Nisha Warrier, MD, MPH (vitreoretinal); Chau M. Pham, MD, FACS (oculoplastic surgery).
      Cataract inquiries use medical scheduling for an evaluation. A website listing does not establish a bookable provider, location, or time. Confirm the named provider only from scheduling results or staff; do not substitute a website name for a different returned provider.
      Source: https://www.bettervision.net/eye-doctor-fort-myers/ (checked September 14, 2026).
  - id: "optometrists"
    title: "Routine eye care and optometrists"
    text: |-
      Frantz EyeCare has several optometrists for routine eye care. Say: "We have several great optometrists. Do you have a preferred location or doctor?" Give individual names when requested rather than reading the entire directory.
      The directory lists Clare Meyers, Sandler L. Burkley, Brittany P. Coyle, Veronique Edward, Stephen J. Haidet, Jamie N. Hogan, Tammy Johnson, Joseph Legiec, Thy A. Nguyen, Roger Paez, Mark P. Strosser, and Nicole M. Yontz, all ODs.
      Routine eye exams, glasses, and contacts without an active eye problem use routine_vision. Age restrictions and provider-location assignments require scheduling or staff confirmation.
      Source: https://www.bettervision.net/eye-doctor-fort-myers/ (checked September 14, 2026).
  - id: "scope-of-services"
    title: "Basic services"
    text: |-
      Frantz EyeCare offers cataract care, laser vision correction, retina, glaucoma, cornea, dry-eye care, eyelid/cosmetic services, and optical services including eyewear and contact lenses. Explain scheduling options without diagnosing or recommending treatment. Do not assume every service is offered at every location.
      Source: https://www.bettervision.net/ (checked September 14, 2026).
  - id: "urgent-and-earlier-appointments"
    title: "Eye emergencies and requests to be squeezed in"
    text: |-
      Immediately transfer eye emergencies to staff, including sudden vision loss, new flashes or floaters, a curtain or shadow in vision, eye trauma, chemical exposure, or severe eye pain with sudden visual symptoms. Do not delay for routine scheduling or patient registration.
      Also transfer requests to be squeezed in or seen sooner because the schedule is booked out, including "I was told you are booked for five months." Preserve the reason and requested timing for staff. Do not promise an earlier appointment or treat a callback request as a completed transfer. Follow the transfer tool result if staff cannot be reached.
      Routing policy for this phone route, supplied by the practice setup; not a website statement.
  - id: "insurance-and-referrals"
    title: "Insurance, pricing, and office policies"
    text: |-
      Insurance participation answers require a successful check_insurance result; participation does not guarantee eligibility, benefits, authorization, or payment. Prices, referral requirements, pediatric age limits, dedicated billing and after-hours numbers, fax, document-delivery email, glasses readiness, and repair policies are not verified in this source. Use staff help for these details rather than inventing an answer.
