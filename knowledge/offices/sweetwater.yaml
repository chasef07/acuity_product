  - id: "insurance-and-referrals"
    title: "Insurance and Referrals"
    text: |-
      Routine vision appointment eligibility and coverage checks go to Scheduling follow-up (appointments), handled by the call center. The Eligibility team handles medical appointments only, in Insurance and prior authorizations (insurance). Pharmacy requests for medication authorization go to Clinical, medication and pharmacy (medication), handled by Jianna Perdomo.

      For routine-vision patients, some insurances do not cover retinal photos and there is a $39 charge.
      
      Retina surgical care needs referral to a retina surgeon. A primary care provider or insurance company can provide an appropriate referral when the patient does not have a retina surgeon.
