  - id: "medical-records-requests"
    title: "Medical records requests and patient email limits"
    text: |-
      Records intake identifies whether the requester is a patient, medical office, or attorney office, and which records are requested. Patient callers provide their full name and date of birth; medical-office callers provide the office and requesting doctor's names. Preserve available patient details separately from requester details, without claiming identity verification.

      Attorney offices must fax both the records request and patient authorization before fulfillment. Ask whether each was faxed (yes, no, or unknown) and when each was sent. If either is missing, explain the fax prerequisite. Caller-reported sending does not establish office receipt or valid authorization. Use only a supplied office fax number; do not invent one.

      For requested fax delivery, collect the destination fax number. For patient email delivery, collect the complete email address. Only a visit summary may be emailed to patients; full visit notes cannot. Preserve a request for full notes and its delivery preference for staff clarification; do not silently substitute a summary or promise another delivery method is approved.

      Preserve applicable collected details and explicitly list missing details or prerequisites in the staff request, even when intake is incomplete. Submitting the request means staff review, not records delivery or verified authorization. A glasses or contact-lens prescription copy is an optical request, rather than a full medical-records request.
  - id: "optical-and-glasses"
    title: "Optical and Glasses"
    text: |-
      Sweetwater stocks many major frame brands, including Ray-Ban, Nike, Gucci, Chloe, Montblanc, Puma, Cartier, Lindberg, Mykita, and YSL.
      
      Lens upgrades and treatments are available. The office offers all types of lenses, including upgrades and treatments.
      
      Eyeglass prescriptions are valid for up to 2 years, but a yearly eye exam is recommended to make sure the prescription is current.
      
      If a patient wants glasses and already has a prescription, they can bring the prescription from their optometrist and choose from the office's frame selection. Patients needing a prescription can obtain one through an optometrist appointment.
      
      Glasses are usually ready in less than 10 business days.
      
      Non-prescription sunglasses are available for purchase. If the patient wears prescription glasses, the office can customize prescription lenses into those frames. Most vision insurance plans do not cover non-prescription sunglasses. Sunglass brands include Maui Jim, Costa, Ray-Ban, Gucci, and many more.
      
      Betty is the licensed optician. She has over 30 years of eyecare experience and specializes in frames, lenses, and fittings.
      
      No appointment is needed to look at glasses or have current glasses adjusted. Betty and Oliva are in the office Monday–Friday 8:30 AM–4:30 PM.
      
      Glasses pickup policy: a readiness text confirms glasses are ready for pickup; patients wait for that text before coming in. This policy does not establish an individual order's readiness.
